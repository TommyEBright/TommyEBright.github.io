<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validity, Reliability and Agreement</title>
<style>
/* -- TOKENS ------------------------------------------------------- */
:root {
  --bg:#f0f4f8; --surface:#fff; --surface2:#f8fafc; --border:#e2e8f0;
  --border-dark:#cbd5e1; --text:#1e293b; --muted:#64748b; --light:#94a3b8;
  --primary:#1d4ed8; --primary-dk:#1e40af; --primary-lt:#eff6ff;
  --c1:#0072B2; --c2:#E69F00; --c3:#009E73; --c4:#D55E00;
  --c5:#56B4E9; --c6:#CC79A7; --c7:#F0E442;
  --good:#059669; --warn:#d97706; --bad:#dc2626;
  --good-bg:#ecfdf5; --warn-bg:#fffbeb; --bad-bg:#fef2f2;
  --r:8px; --r-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05);
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Menlo','Consolas',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

/* -- HEADER ------------------------------------------------------- */
#hdr{background:var(--primary-dk);color:#fff;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-inner{max-width:1120px;margin:0 auto;padding:0 1rem;display:flex;
  align-items:center;gap:2rem}
.hdr-title{font-size:.95rem;font-weight:700;white-space:nowrap;padding:.75rem 0;
  letter-spacing:-.01em}
.snav{display:flex;overflow-x:auto;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav button{background:none;border:none;color:rgba(255,255,255,.65);
  padding:.75rem .95rem;font-size:.82rem;font-family:var(--font);cursor:pointer;
  white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;
  transition:color .15s,border-color .15s}
.snav button:hover{color:#fff}
.snav button.act{color:#fff;border-bottom-color:#93c5fd}
.snav button:focus-visible{outline:2px solid #93c5fd;outline-offset:-2px}

/* -- LAYOUT ------------------------------------------------------- */
#main{max-width:1120px;margin:0 auto;padding:1.5rem 1rem 3rem}
.pane{display:none}.pane.act{display:block}

/* -- CARDS -------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1.5rem;
  margin-bottom:1.25rem}
.card-title{font-size:1rem;font-weight:600;margin-bottom:.75rem;
  padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.card-sub{font-size:.85rem;color:var(--muted);margin-bottom:1rem}

/* -- STATION HEADER ----------------------------------------------- */
.stn-hdr{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.5rem}
.stn-badge{background:var(--primary);color:#fff;width:2.5rem;height:2.5rem;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1.1rem;flex-shrink:0}
.stn-title{font-size:1.35rem;font-weight:700}
.stn-desc{font-size:.875rem;color:var(--muted);margin-top:.2rem}

/* -- BUTTONS ------------------------------------------------------ */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .95rem;
  border-radius:var(--r);border:none;font-family:var(--font);font-size:.83rem;
  font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-dk)}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border-dark)}
.btn-s:hover{background:var(--border)}
.btn-d{background:#fef2f2;color:var(--bad);border:1px solid #fecaca}
.btn-d:hover{background:#fee2e2}
.btn-sm{padding:.28rem .65rem;font-size:.78rem}
.btn-grp{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* -- FORM --------------------------------------------------------- */
.f-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.f-grp{display:flex;flex-direction:column;gap:.3rem}
.f-grp label{font-size:.8rem;font-weight:500;color:var(--muted)}
.f-grp input,.f-grp select{padding:.38rem .6rem;border:1px solid var(--border-dark);
  border-radius:var(--r);font-family:var(--font);font-size:.875rem;color:var(--text);
  background:var(--surface)}
.f-grp input:focus,.f-grp select:focus{outline:2px solid var(--primary);outline-offset:1px}

/* -- DATA GRID ---------------------------------------------------- */
.grid-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)}
.dgrid{border-collapse:collapse;width:100%;font-size:.83rem}
.dgrid th{background:var(--surface2);border-bottom:2px solid var(--border-dark);
  padding:.45rem .6rem;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap}
.dgrid td{border-bottom:1px solid var(--border);padding:0}
.dgrid td input{width:100%;border:none;padding:.42rem .6rem;background:transparent;
  font-size:.83rem;font-family:var(--font);color:var(--text)}
.dgrid td input:focus{background:var(--primary-lt);outline:none}
.dgrid td input.calc{background:#f1f5f9;color:#334155;font-weight:600;cursor:default}
.dgrid th.calc{background:#e8eef6;color:#334155}
.dgrid tr:hover td{background:#fafafa}
.dgrid tr:hover td input:not(:focus){background:#fafafa}

/* -- STAT CARDS --------------------------------------------------- */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin-bottom:1rem}
.sc{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.sc.good{border-left:3px solid var(--good)}
.sc.warn{border-left:3px solid var(--warn)}
.sc.bad{border-left:3px solid var(--bad)}
.sc-lbl{font-size:.75rem;color:var(--muted);font-weight:500;text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:.2rem}
.sc-val{font-size:1.55rem;font-weight:700;line-height:1.2}
.sc-ci{font-size:.75rem;color:var(--muted);margin-top:.12rem}
.sc-int{font-size:.75rem;color:var(--muted);margin-top:.35rem;padding-top:.35rem;
  border-top:1px solid var(--border);line-height:1.4}

/* -- CHART WRAP --------------------------------------------------- */
.ch-wrap{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.ch-wrap svg{display:block;width:100%;height:auto}
.ch-actions{display:flex;gap:.4rem;position:absolute;top:.5rem;right:.5rem;
  opacity:0;transition:opacity .2s}
.ch-wrap:hover .ch-actions{opacity:1}
.ch-title{font-size:.82rem;font-weight:600;color:var(--muted);padding:.6rem .75rem .25rem;
  background:var(--surface2);border-bottom:1px solid var(--border)}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:680px){.ch2{grid-template-columns:1fr}}

/* -- RESULTS TABLE ------------------------------------------------ */
.rtbl{width:100%;border-collapse:collapse;font-size:.83rem}
.rtbl th{background:var(--surface2);padding:.45rem .7rem;text-align:left;
  font-weight:600;color:var(--muted);border-bottom:2px solid var(--border-dark)}
.rtbl td{padding:.45rem .7rem;border-bottom:1px solid var(--border)}
.rtbl tr:last-child td{border-bottom:none}
.rtbl .mono{font-family:var(--mono)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);margin-bottom:1rem}

/* -- CALLOUTS ----------------------------------------------------- */
.co{padding:.7rem .95rem;border-radius:var(--r);font-size:.83rem;margin-bottom:.9rem;border-left:3px solid}
.co-info{background:#eff6ff;border-color:var(--primary);color:#1e40af}
.co-warn{background:var(--warn-bg);border-color:var(--warn);color:#92400e}
.co-note{background:var(--surface2);border-color:var(--border-dark);color:var(--muted)}

/* -- THRESHOLDS --------------------------------------------------- */
.thr-row{display:flex;gap:1rem;align-items:center;padding:.65rem 1rem;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:.9rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.thr-row input[type=number]{width:68px;padding:.28rem .45rem;border:1px solid var(--border-dark);
  border-radius:4px;font-size:.83rem;font-family:var(--font)}

/* -- TOGGLES ------------------------------------------------------ */
.tog-grp{display:flex;gap:.35rem;flex-wrap:wrap}
.tog{padding:.28rem .75rem;border-radius:100px;border:1px solid var(--border-dark);
  background:var(--surface);font-size:.78rem;font-family:var(--font);cursor:pointer;
  font-weight:500;color:var(--muted);transition:all .15s}
.tog.act{background:var(--primary);border-color:var(--primary);color:#fff}
.tog:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* -- PASTE AREA --------------------------------------------------- */
.paste-zone{border:2px dashed var(--border-dark);border-radius:var(--r);
  padding:1.25rem;text-align:center;color:var(--muted);font-size:.83rem;
  cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.paste-zone:hover,.paste-zone.over{border-color:var(--primary);
  background:var(--primary-lt);color:var(--primary)}
.paste-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

/* -- REFLECTIONS -------------------------------------------------- */
.refl-card{background:#fefce8;border:1px solid #fef08a;border-radius:var(--r);
  padding:.95rem;margin-bottom:.7rem}
.refl-guide-row{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
.refl-guide-row .btn:disabled{opacity:.5;cursor:not-allowed}
.refl-hint{font-size:.75rem;color:#a16207}
.refl-guide{margin-top:.6rem;background:#fff;border:1px solid #fde68a;border-left:3px solid #0072B2;border-radius:4px;padding:.6rem .8rem;font-size:.82rem;line-height:1.5;color:var(--text)}
.refl-guide-ttl{font-weight:700;font-size:.78rem;color:#0072B2;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.3rem}
.refl-guide ul{margin:0;padding-left:1.1rem}
.refl-guide li{margin:.25rem 0}
.refl-q{font-weight:600;font-size:.875rem;color:#713f12;margin-bottom:.45rem}
.refl-card textarea{width:100%;border:1px solid #fde047;border-radius:4px;
  padding:.45rem;font-family:var(--font);font-size:.83rem;background:#fff;
  resize:vertical;min-height:70px}

/* -- OVERVIEW TABLE ----------------------------------------------- */
.ovtbl{width:100%;border-collapse:collapse;font-size:.875rem}
.ovtbl th{background:var(--primary-dk);color:#fff;padding:.55rem .85rem;text-align:left;font-weight:600}
.ovtbl td{padding:.55rem .85rem;border-bottom:1px solid var(--border);vertical-align:top}
.ovtbl tr:nth-child(even) td{background:var(--surface2)}
.tag{display:inline-block;padding:.18rem .5rem;border-radius:100px;font-size:.72rem;font-weight:600;margin:.1rem}
.t-rel{background:#dbeafe;color:#1e40af}
.t-agr{background:#dcfce7;color:#166534}
.t-ir{background:#fce7f3;color:#831843}
.t-cor{background:#fef9c3;color:#713f12}

/* -- STATION 5 ---------------------------------------------------- */
#lt-wrap{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
#lt-svg{display:block;width:100%;cursor:crosshair;touch-action:none}
.lt-readout{background:rgba(255,255,255,.97);border:1px solid var(--border-dark);
  border-radius:var(--r);padding:.45rem .7rem;font-size:.78rem;line-height:1.85;
  min-width:155px;box-shadow:var(--shadow);pointer-events:none}

/* -- RESPONSIVE --------------------------------------------------- */
@media(max-width:600px){
  .hdr-title{display:none}
  .sc-val{font-size:1.25rem}
  #main{padding:1rem .7rem 3rem}
  .card{padding:1rem}
}

/* -- PRINT -------------------------------------------------------- */
@media print{
  #hdr,.btn,.btn-grp,.paste-zone,.thr-row,.tog-grp{display:none!important}
  .pane{display:block!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body{background:#fff}
}
</style>

<div id="hdr">
  <div class="hdr-inner">
    <div class="hdr-title">Validity, Reliability &amp; Agreement</div>
    <nav class="snav" role="tablist" aria-label="Stations">
      <button role="tab" data-tab="overview" class="act">Overview</button>
      <button role="tab" data-tab="s1">1&nbsp;Grip Strength</button>
      <button role="tab" data-tab="s2">2&nbsp;Jump Height</button>

    </nav>
  </div>
</div>

<div id="main">
  <div id="pane-overview" class="pane act"></div>
  <div id="pane-s1"       class="pane"></div>
  <div id="pane-s2"       class="pane"></div>
  <div id="pane-s3"       class="pane"></div>
  <div id="pane-s4"       class="pane"></div>

<script>
'use strict';
/* ===================================================================
   VALIDITY, RELIABILITY AND AGREEMENT — LAB TOOL
   Sport & Exercise Science · Postgraduate Session
   Single file, no dependencies. British English throughout.
=================================================================== */

/* -- SECTION: MATH UTILS ------------------------------------------- */
const sum  = a => a.reduce((s,x)=>s+x, 0);
const mean = a => sum(a)/a.length;
const sq   = x => x*x;

function variance(a, ddof=1){
  const m=mean(a); return sum(a.map(x=>sq(x-m)))/(a.length-ddof);
}
function sd(a,ddof=1){ return Math.sqrt(variance(a,ddof)); }
function cov(x,y){
  const mx=mean(x),my=mean(y);
  return sum(x.map((xi,i)=>(xi-mx)*(y[i]-my)))/(x.length-1);
}
function zip(a,b){ return a.map((v,i)=>[v,b[i]]); }
function linspace(a,b,n){
  return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
}

/* -- SECTION: SPECIAL FUNCTIONS ----------------------------------- */
function lgamma(x){
  if(x<.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);
  x-=1;
  const c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
    771.32342877765313,-176.61502916214059,12.507343278686905,
    -.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  let a=c[0];
  const t=x+7.5;
  for(let i=1;i<9;i++) a+=c[i]/(x+i);
  return .5*Math.log(2*Math.PI)+(x+.5)*Math.log(t)-t+Math.log(a);
}

function betaCF(x,a,b){
  const MAXIT=200,EPS=3e-7,FP=1e-30;
  const qab=a+b,qap=a+1,qam=a-1;
  let c=1,d=Math.max(1-qab*x/qap,FP); d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=Math.max(1+aa*d,FP); c=Math.max(1+aa/c,FP); d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=Math.max(1+aa*d,FP); c=Math.max(1+aa/c,FP); d=1/d;
    const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;
  }
  return h;
}

function betaInc(x,a,b){
  if(x<=0) return 0; if(x>=1) return 1;
  const lb=lgamma(a)+lgamma(b)-lgamma(a+b);
  if(x<(a+1)/(a+b+2))
    return Math.exp(a*Math.log(x)+b*Math.log(1-x)-lb)*betaCF(x,a,b)/a;
  return 1-Math.exp(b*Math.log(1-x)+a*Math.log(x)-lb)*betaCF(1-x,b,a)/b;
}

function betaInv(p,a,b){
  if(p<=0) return 0; if(p>=1) return 1;
  let x=a/(a+b);
  for(let i=0;i<200;i++){
    const err=betaInc(x,a,b)-p;
    if(Math.abs(err)<1e-9) break;
    const deriv=Math.exp((a-1)*Math.log(Math.max(x,1e-15))
      +(b-1)*Math.log(Math.max(1-x,1e-15))+lgamma(a+b)-lgamma(a)-lgamma(b));
    x=Math.max(1e-10,Math.min(1-1e-10,x-err/Math.max(deriv,1e-15)));
  }
  return x;
}

// F-distribution quantile via regularised incomplete beta
function fQ(p,d1,d2){
  const x=betaInv(p,d1/2,d2/2);
  return (x*d2)/((1-x)*d1);
}
// t-distribution quantile
function tQ(p,df){
  if(p<.5) return -tQ(1-p,df);
  const x=betaInv(2*(1-p),df/2,.5);
  return Math.sqrt(df*(1-x)/x);
}
// chi-squared quantile (F(df,large) * df → chi2)
function chi2Q(p,df){ return df*fQ(p,df,1e6); }

/* -- SECTION: STATS LIBRARY ---------------------------------------- */

/**
 * Intraclass correlation coefficient.
 * @param {number[][]} mat  rows=subjects, cols=raters/trials
 * @param {'1,1'|'2,1'|'3,1'} model
 * @returns {object} icc, ci_l, ci_u, warning
 */
function icc(mat, model='2,1'){
  const validRows=mat.filter(r=>r.every(v=>v!=null&&!isNaN(v)));
  if(validRows.length<3) return {icc:NaN,ci_l:NaN,ci_u:NaN,warning:'Minimum 3 complete rows needed.'};
  const n=validRows.length, k=validRows[0].length;
  if(k<2) return {icc:NaN,ci_l:NaN,ci_u:NaN,warning:'At least 2 trials/raters required.'};

  const grand=mean(validRows.flat());
  const rowM=validRows.map(r=>mean(r));
  const colM=Array.from({length:k},(_,j)=>mean(validRows.map(r=>r[j])));

  const SSB=k*sum(rowM.map(m=>sq(m-grand)));
  const SSR=n*sum(colM.map(m=>sq(m-grand)));
  const SST=sum(validRows.flat().map(v=>sq(v-grand)));
  const SSW=SST-SSB;
  const SSE=SST-SSB-SSR;

  const MSB=SSB/(n-1);
  const MSW=SSW/(n*(k-1));
  const MSR=SSR/(k-1);
  const MSE=Math.max(SSE/((n-1)*(k-1)),1e-12);

  let iccVal, F, df1, df2;
  const warn=[];
  if(n<10) warn.push('n is small; confidence intervals will be wide.');

  if(model==='1,1'){
    iccVal=(MSB-MSW)/(MSB+(k-1)*MSW);
    F=MSB/MSW; df1=n-1; df2=n*(k-1);
  } else if(model==='2,1'){
    iccVal=(MSB-MSE)/(MSB+(k-1)*MSE+k*(MSR-MSE)/n);
    F=MSB/MSE; df1=n-1; df2=(n-1)*(k-1);
  } else { // 3,1
    iccVal=(MSB-MSE)/(MSB+(k-1)*MSE);
    F=MSB/MSE; df1=n-1; df2=(n-1)*(k-1);
  }

  let ci_l,ci_u;
  if(model==='2,1'){
    // Absolute agreement: rater variance enters the CI via Satterthwaite df (Shrout & Fleiss 1979; McGraw & Wong 1996)
    const r=Math.min(iccVal,1-1e-9);
    const a=k*r/(n*(1-r)), b=1+k*r*(n-1)/(n*(1-r));
    const v=sq(a*MSR+b*MSE)/(sq(a*MSR)/(k-1)+sq(b*MSE)/((n-1)*(k-1)));
    const Fs=fQ(.975,n-1,v), Fss=fQ(.975,v,n-1);
    const denom=k*MSR+(k*n-k-n)*MSE;
    ci_l=n*(MSB-Fs*MSE)/(Fs*denom+n*MSB);
    ci_u=n*(Fss*MSB-MSE)/(denom+n*Fss*MSB);
  } else {
    const Fl=F/fQ(.975,df1,df2);
    const Fu=F*fQ(.975,df2,df1);
    ci_l=(Fl-1)/(Fl+k-1);
    ci_u=(Fu-1)/(Fu+k-1);
  }

  return {icc:iccVal,ci_l:Math.max(-1,ci_l),ci_u:Math.min(1,ci_u),
    F,df1,df2,MSB,MSW,MSR,MSE,n,k,warning:warn.join(' ')};
}

/**
 * Coefficient of variation from log-transformed data.
 * @param {number[][]} mat  rows=subjects, cols=trials
 */
function cvPercent(mat){
  const valid=mat.filter(r=>r.every(v=>v>0&&!isNaN(v)));
  if(valid.length<3) return {cv:NaN,ci_l:NaN,ci_u:NaN,warning:'Minimum 3 complete rows with positive values.'};
  const n=valid.length, k=valid[0].length;
  const logMat=valid.map(r=>r.map(Math.log));
  const rowLogM=logMat.map(r=>mean(r));
  const grandLogM=mean(rowLogM);
  const SSW_log=sum(logMat.map((r,i)=>sum(r.map(v=>sq(v-rowLogM[i])))));
  const df=n*(k-1);
  const msw_log=SSW_log/df;
  const swLog=Math.sqrt(msw_log);
  const cvVal=(Math.sqrt(Math.exp(msw_log)-1))*100;
  // CI via chi-squared on MSW
  const chi_l=chi2Q(.025,df), chi_u=chi2Q(.975,df);
  const sw_l=Math.sqrt(msw_log*df/chi_u);
  const sw_u=Math.sqrt(msw_log*df/chi_l);
  const cv_l=Math.sqrt(Math.exp(sq(sw_l))-1)*100;
  const cv_u=Math.sqrt(Math.exp(sq(sw_u))-1)*100;
  const warn=df<10?'Few degrees of freedom; interval is wide.':'';
  return {cv:cvVal,ci_l:cv_l,ci_u:cv_u,n,k,df,warning:warn};
}

/**
 * Bland-Altman analysis.
 * @param {number[]} a  method/device A values
 * @param {number[]} b  method/device B values
 */
function blandAltman(a,b){
  const pairs=zip(a,b).filter(([x,y])=>x!=null&&y!=null&&!isNaN(x)&&!isNaN(y));
  if(pairs.length<4) return {n:pairs.length,warning:'Minimum 4 pairs needed.'};
  const n=pairs.length;
  const diffs=pairs.map(([x,y])=>x-y);
  const means=pairs.map(([x,y])=>(x+y)/2);
  const bias=mean(diffs);
  const s=sd(diffs);
  const loa_u=bias+1.96*s, loa_l=bias-1.96*s;
  const t=tQ(.975,n-1);
  const se_bias=s/Math.sqrt(n);
  const se_loa=Math.sqrt(3*sq(s)/n);
  // Proportional bias via regression of diff on mean
  const pb=linearRegress(means,diffs);
  const warn=[];
  if(n<15) warn.push('n is small; limits of agreement may be imprecise.');
  if(Math.abs(pb.r)>.3) warn.push('Possible proportional bias (r='+pb.r.toFixed(2)+').');
  return {
    n, bias, sd:s, loa_u, loa_l,
    ci_bias:[bias-t*se_bias, bias+t*se_bias],
    ci_loa_u:[loa_u-t*se_loa, loa_u+t*se_loa],
    ci_loa_l:[loa_l-t*se_loa, loa_l+t*se_loa],
    propBias:pb, diffs, means, warning:warn.join(' ')
  };
}

/**
 * Pearson correlation with 95% CI (Fisher z).
 */
function pearsonR(x,y){
  const pairs=zip(x,y).filter(([a,b])=>!isNaN(a)&&!isNaN(b)&&a!=null&&b!=null);
  if(pairs.length<4) return {r:NaN,ci_l:NaN,ci_u:NaN,warning:'Minimum 4 pairs needed.'};
  const n=pairs.length;
  const xs=pairs.map(p=>p[0]),ys=pairs.map(p=>p[1]);
  const r=cov(xs,ys)/(sd(xs)*sd(ys));
  const z=Math.atanh(Math.max(-1+1e-8,Math.min(1-1e-8,r)));
  const se=1/Math.sqrt(n-3);
  const warn=n<10?'n is small; interval is wide.':'';
  return {r,ci_l:Math.tanh(z-1.96*se),ci_u:Math.tanh(z+1.96*se),n,warning:warn};
}

/**
 * Spearman correlation with 95% CI (Bonett & Wright 2000).
 */
function rankArray(a){
  const sorted=[...a].map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
  const ranks=new Array(a.length);
  let i=0;
  while(i<sorted.length){
    let j=i;
    while(j<sorted.length-1&&sorted[j+1].v===sorted[j].v) j++;
    const r=(i+j)/2+1;
    for(let k=i;k<=j;k++) ranks[sorted[k].i]=r;
    i=j+1;
  }
  return ranks;
}

function spearmanR(x,y){
  const pairs=zip(x,y).filter(([a,b])=>!isNaN(a)&&!isNaN(b)&&a!=null&&b!=null);
  if(pairs.length<4) return {rs:NaN,ci_l:NaN,ci_u:NaN,warning:'Minimum 4 pairs needed.'};
  const n=pairs.length;
  const xs=pairs.map(p=>p[0]),ys=pairs.map(p=>p[1]);
  const rx=rankArray(xs),ry=rankArray(ys);
  const rs=cov(rx,ry)/(sd(rx)*sd(ry));
  const z=Math.atanh(Math.max(-1+1e-8,Math.min(1-1e-8,rs)));
  const se=Math.sqrt((1+sq(rs)/2)/(n-3));  // Bonett-Wright SE
  const warn=n<10?'n is small; interval is wide.':'';
  return {rs,ci_l:Math.tanh(z-1.96*se),ci_u:Math.tanh(z+1.96*se),n,warning:warn};
}

/**
 * Simple linear regression.
 */
function linearRegress(x,y){
  const n=x.length;
  const mx=mean(x),my=mean(y);
  const slope=cov(x,y)/variance(x);
  const intercept=my-slope*mx;
  const r=cov(x,y)/(sd(x)*sd(y));
  const yhat=x.map(xi=>slope*xi+intercept);
  const ssTot=sum(y.map(yi=>sq(yi-my)));
  const ssRes=sum(y.map((yi,i)=>sq(yi-yhat[i])));
  const r2=1-ssRes/ssTot;
  return {slope,intercept,r,r2,n};
}

/**
 * Polynomial least-squares fit (Gauss-Jordan on normal equations).
 * @param {number[]} x
 * @param {number[]} y
 * @param {number}   deg  degree (2 or 3)
 * @returns {{coeffs:number[], predict:(x:number)=>number, r2:number}}
 */
function polyFit(x,y,deg=3){
  const d=deg+1;
  // Build normal equations matrix A (d×d) and RHS b (d)
  const A=Array.from({length:d},()=>new Array(d).fill(0));
  const b=new Array(d).fill(0);
  for(let i=0;i<d;i++){
    for(let j=0;j<d;j++) A[i][j]=sum(x.map(xi=>Math.pow(xi,i+j)));
    b[i]=sum(x.map((xi,k)=>Math.pow(xi,i)*y[k]));
  }
  // Gauss-Jordan elimination
  const aug=A.map((row,i)=>[...row,b[i]]);
  for(let col=0;col<d;col++){
    let pivot=col;
    for(let r=col+1;r<d;r++) if(Math.abs(aug[r][col])>Math.abs(aug[pivot][col])) pivot=r;
    [aug[col],aug[pivot]]=[aug[pivot],aug[col]];
    const pv=aug[col][col];
    if(Math.abs(pv)<1e-12) continue;
    for(let j=col;j<=d;j++) aug[col][j]/=pv;
    for(let r=0;r<d;r++) if(r!==col){
      const f=aug[r][col];
      for(let j=col;j<=d;j++) aug[r][j]-=f*aug[col][j];
    }
  }
  const coeffs=aug.map(r=>r[d]);
  const predict=xv=>coeffs.reduce((s,c,i)=>s+c*Math.pow(xv,i),0);
  const yhat=x.map(predict);
  const my=mean(y);
  const r2=1-sum(y.map((yi,i)=>sq(yi-yhat[i])))/sum(y.map(yi=>sq(yi-my)));
  return {coeffs,predict,r2};
}

/**
 * Dmax lactate threshold.
 * Find point on fitted curve with maximum perpendicular distance
 * from the straight line between first and last data point.
 */
function dmax(xs,ys,deg=3){
  if(xs.length<4) return null;
  const fit=polyFit(xs,ys,deg);
  const x1=xs[0],y1=ys[0],x2=xs[xs.length-1],y2=fit.predict(x2);
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(sq(dx)+sq(dy));
  const pts=linspace(x1,x2,200);
  let maxD=0,maxX=x1;
  for(const px of pts){
    const py=fit.predict(px);
    const d=Math.abs((py-y1)*dx-(px-x1)*dy)/len;
    if(d>maxD){maxD=d;maxX=px;}
  }
  return {x:maxX,y:fit.predict(maxX),fit};
}

/**
 * Modified Dmax — line starts from first point where lactate exceeds
 * resting+0.5 mmol/L (or a supplied baseline).
 */
function modDmax(xs,ys,baseline=null,deg=3){
  if(xs.length<4) return null;
  const fit=polyFit(xs,ys,deg);
  const bl=baseline??ys[0];
  let startIdx=ys.findIndex(y=>y>bl+0.5);
  if(startIdx<0) startIdx=0;
  const x1=xs[startIdx],y1=fit.predict(x1);
  const x2=xs[xs.length-1],y2=fit.predict(x2);
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(sq(dx)+sq(dy));
  if(len<1e-8) return null;
  const pts=linspace(x1,x2,200);
  let maxD=0,maxX=x1;
  for(const px of pts){
    const py=fit.predict(px);
    const d=Math.abs((py-y1)*dx-(px-x1)*dy)/len;
    if(d>maxD){maxD=d;maxX=px;}
  }
  return {x:maxX,y:fit.predict(maxX),fit};
}

/**
 * Exponential lactate fit y = a + b*exp(c*u), with u = x rescaled to 0..1 so exp() cannot overflow.
 * For a given c the model is linear in a and b, so c is found by golden-section search on the SSE.
 */
function expFit(xs,ys){
  const x0=Math.min(...xs), span=(Math.max(...xs)-x0)||1;
  const us=xs.map(x=>(x-x0)/span);
  const solve=c=>{
    const e=us.map(u=>Math.exp(c*u));
    const lr=linearRegress(e,ys);
    return {a:lr.intercept,b:lr.slope,sse:sum(ys.map((y,i)=>sq(y-(lr.intercept+lr.slope*e[i]))))};
  };
  const gr=(Math.sqrt(5)-1)/2;
  let lo=0.05,hi=15;
  let c1=hi-gr*(hi-lo),c2=lo+gr*(hi-lo),f1=solve(c1).sse,f2=solve(c2).sse;
  for(let i=0;i<80;i++){
    if(f1<f2){ hi=c2; c2=c1; f2=f1; c1=hi-gr*(hi-lo); f1=solve(c1).sse; }
    else     { lo=c1; c1=c2; f1=f2; c2=lo+gr*(hi-lo); f2=solve(c2).sse; }
  }
  const c=(lo+hi)/2,{a,b}=solve(c);
  return {a,b,c,predict:x=>a+b*Math.exp(c*(x-x0)/span)};
}

/**
 * Log-log lactate threshold (Beaver, Wasserman & Whipp 1985): two-segment linear regression of
 * log(lactate) on log(x); the threshold is where the best-fitting pair of lines intersect.
 */
function logLogLT(xs,ys){
  const n=xs.length;
  if(n<4||xs.some(x=>!(x>0))||ys.some(y=>!(y>0))) return null;
  const lx=xs.map(Math.log),ly=ys.map(Math.log);
  const minSeg=n>=6?3:2;
  const sse=(x,y,lr)=>sum(y.map((v,i)=>sq(v-(lr.intercept+lr.slope*x[i]))));
  let best=null;
  for(let k=minSeg;k<=n-minSeg;k++){
    const L=linearRegress(lx.slice(0,k),ly.slice(0,k)),R=linearRegress(lx.slice(k),ly.slice(k));
    const tot=sse(lx.slice(0,k),ly.slice(0,k),L)+sse(lx.slice(k),ly.slice(k),R);
    if(!best||tot<best.tot) best={k,L,R,tot};
  }
  if(!best) return null;
  const {k,L,R}=best;
  let lxT=Math.abs(L.slope-R.slope)>1e-9?(R.intercept-L.intercept)/(L.slope-R.slope):(lx[k-1]+lx[k])/2;
  if(!isFinite(lxT)||lxT<lx[0]||lxT>lx[n-1]) lxT=(lx[k-1]+lx[k])/2;
  return {x:Math.exp(lxT),split:k};
}

/**
 * Log-Exp-ModDmax (Jamnick et al. 2018): exponential curve fit; the Dmax line runs from the
 * log-log threshold on that curve to the final stage.
 */
function logExpModDmax(xs,ys){
  if(xs.length<4) return null;
  const ll=logLogLT(xs,ys); if(!ll) return null;
  const fit=expFit(xs,ys);
  const x1=ll.x,y1=fit.predict(x1),x2=xs[xs.length-1],y2=fit.predict(x2);
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(sq(dx)+sq(dy));
  if(len<1e-8) return null;
  let maxD=0,maxX=x1;
  for(const px of linspace(x1,x2,300)){
    const d=Math.abs((fit.predict(px)-y1)*dx-(px-x1)*dy)/len;
    if(d>maxD){maxD=d;maxX=px;}
  }
  return {x:maxX,y:fit.predict(maxX),fit,start:x1};
}

const fmt1=v=>isNaN(v)||v==null?'—':v.toFixed(1);
const fmt2=v=>isNaN(v)||v==null?'—':v.toFixed(2);
const fmt3=v=>isNaN(v)||v==null?'—':v.toFixed(3);
function fmtCI(l,u,digits=2){
  const f=digits===1?fmt1:digits===3?fmt3:fmt2;
  return isNaN(l)||isNaN(u)?'—':`[${f(l)}, ${f(u)}]`;
}
function ratingLabel(r){
  if(r>=.9)  return {txt:'Excellent',cls:'good'};
  if(r>=.75) return {txt:'Good',cls:'good'};
  if(r>=.5)  return {txt:'Moderate',cls:'warn'};
  return            {txt:'Poor',cls:'bad'};
}
function cvLabel(cv){
  if(cv<=5)  return {txt:'Low',cls:'good'};
  if(cv<=10) return {txt:'Acceptable',cls:'warn'};
  return            {txt:'High',cls:'bad'};
}

/* -- SECTION: SVG CHART HELPERS ------------------------------------ */
const NS='http://www.w3.org/2000/svg';

// SVG presentation attributes are kebab-case; viewBox-style names must keep their case.
const SVG_CAMEL_ATTRS=new Set(['viewBox','preserveAspectRatio','clipPathUnits','gradientUnits','patternUnits','markerWidth','markerHeight','refX','refY']);
function svgEl(tag,attrs={}){
  const el=document.createElementNS(NS,tag);
  Object.entries(attrs).forEach(([k,v])=>{
    const name=SVG_CAMEL_ATTRS.has(k)?k:k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase());
    el.setAttribute(name,v);
  });
  return el;
}

function scaleLin(domain,range){
  const [d0,d1]=domain,[r0,r1]=range;
  const fn=v=>r0+(v-d0)*(r1-r0)/(d1-d0);
  fn.invert=p=>d0+(p-r0)*(d1-d0)/(r1-r0);
  fn.domain=domain; fn.range=range;
  return fn;
}

/** Round-number ticks (steps of 1, 2 or 5 x 10^n) inside [min,max]. */
function niceTicks(min,max,count=5){
  const span=max-min; if(!(span>0)) return [min];
  const raw=span/Math.max(1,count-1), mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const f=raw/mag, step=(f<1.5?1:f<3?2:f<7?5:10)*mag;
  const out=[];
  for(let v=Math.ceil(min/step-1e-9)*step;v<=max+step*1e-9;v+=step) out.push(+v.toFixed(10));
  out.step=step;
  return out;
}
function tickFmt(step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return v=>v.toFixed(d);
}

/**
 * Create an SVG chart scaffold with axes.
 * @returns {{svg,sx,sy,W,H,M,g}}
 */
function makeChart(container,opts={}){
  const VW=opts.vw||500,VH=opts.vh||340;
  const M=opts.margin||{top:20,right:20,bottom:50,left:55};
  const W=VW-M.left-M.right, H=VH-M.top-M.bottom;

  const svg=svgEl('svg',{viewBox:`0 0 ${VW} ${VH}`,role:'img',
    'aria-label':opts.ariaLabel||'Chart'});
  svg.style.fontFamily='inherit';

  // Background
  svg.appendChild(svgEl('rect',{x:0,y:0,width:VW,height:VH,fill:'white'}));

  const g=svgEl('g',{transform:`translate(${M.left},${M.top})`});
  svg.appendChild(g);

  // Axis clip
  const clipId='clip-'+Math.random().toString(36).slice(2);
  const defs=svgEl('defs');
  const clip=svgEl('clipPath',{id:clipId});
  clip.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H}));
  defs.appendChild(clip);
  svg.insertBefore(defs,g);

  const [xMin,xMax]=opts.xDomain||[0,1];
  const [yMin,yMax]=opts.yDomain||[0,1];
  const sx=scaleLin([xMin,xMax],[0,W]);
  const sy=scaleLin([yMin,yMax],[H,0]);

  // Ticks: explicit positions if given, otherwise round numbers inside the domain
  const xT=opts.xTicks||niceTicks(xMin,xMax,opts.ntx||6);
  const yT=opts.yTicks||niceTicks(yMin,yMax,opts.nty||6);
  const xF=opts.xFmt||(xT.step?tickFmt(xT.step):fmt1);
  const yF=opts.yFmt||(yT.step?tickFmt(yT.step):fmt1);

  if(opts.grid!==false){
    const gridG=svgEl('g');
    xT.forEach(v=>gridG.appendChild(svgEl('line',{x1:sx(v),x2:sx(v),y1:0,y2:H,stroke:'#eef2f6',strokeWidth:1})));
    yT.forEach(v=>gridG.appendChild(svgEl('line',{x1:0,x2:W,y1:sy(v),y2:sy(v),stroke:'#eef2f6',strokeWidth:1})));
    g.appendChild(gridG);
  }

  g.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H,fill:'none',stroke:'#cbd5e1',strokeWidth:1}));

  xT.forEach(v=>{
    const tx=svgEl('text',{x:sx(v),y:H+16,textAnchor:'middle',fontSize:10,fill:'#64748b'});
    tx.textContent=xF(v); g.appendChild(tx);
    g.appendChild(svgEl('line',{x1:sx(v),x2:sx(v),y1:H,y2:H+4,stroke:'#94a3b8'}));
  });
  yT.forEach(v=>{
    const ty=svgEl('text',{x:-7,y:sy(v)+3.5,textAnchor:'end',fontSize:10,fill:'#64748b'});
    ty.textContent=yF(v); g.appendChild(ty);
    g.appendChild(svgEl('line',{x1:0,x2:-4,y1:sy(v),y2:sy(v),stroke:'#94a3b8'}));
  });

  // Axis labels
  if(opts.xLabel){
    const xl=svgEl('text',{x:W/2,y:H+38,textAnchor:'middle',fontSize:11,
      fill:'#475569',fontWeight:600});
    xl.textContent=opts.xLabel; g.appendChild(xl);
  }
  if(opts.yLabel){
    const ylr=svgEl('text',{x:0,y:0,textAnchor:'middle',fontSize:11,
      fill:'#475569',fontWeight:600,transform:`translate(${-M.left+14},${H/2}) rotate(-90)`});
    ylr.textContent=opts.yLabel;
    g.appendChild(ylr);
  }

  // Helpers on the returned object
  function addPoints(pts,color='#0072B2',r=4,shape='circle',opacity=1){
    const gp=svgEl('g',{'clip-path':`url(#${clipId})`});
    pts.forEach(([px,py])=>{
      if(px==null||py==null||isNaN(px)||isNaN(py)) return;
      const cx=sx(px),cy=sy(py);
      if(shape==='circle'){
        gp.appendChild(svgEl('circle',{cx,cy,r,fill:color,opacity,
          stroke:'white',strokeWidth:1}));
      } else if(shape==='cross'){
        const d=r+1;
        const el=svgEl('path',{d:`M${cx-d},${cy} L${cx+d},${cy} M${cx},${cy-d} L${cx},${cy+d}`,
          stroke:color,strokeWidth:2,opacity});
        gp.appendChild(el);
      }
    });
    g.appendChild(gp);
    return gp;
  }

  function addLine(pts,color='#1d4ed8',sw=2,dash=''){
    const gp=svgEl('g',{'clip-path':`url(#${clipId})`});
    const valid=pts.filter(([x,y])=>x!=null&&y!=null&&!isNaN(x)&&!isNaN(y));
    if(valid.length<2){g.appendChild(gp);return gp;}
    const d='M'+valid.map(([x,y])=>`${sx(x)},${sy(y)}`).join('L');
    gp.appendChild(svgEl('path',{d,stroke:color,strokeWidth:sw,fill:'none',
      strokeDasharray:dash}));
    g.appendChild(gp);
    return gp;
  }

  function addHLine(yv,color='#dc2626',sw=1.5,dash='4,3',label=''){
    const gp=svgEl('g',{'clip-path':`url(#${clipId})`});
    gp.appendChild(svgEl('line',{x1:0,x2:W,y1:sy(yv),y2:sy(yv),
      stroke:color,strokeWidth:sw,strokeDasharray:dash}));
    if(label){
      const t=svgEl('text',{x:W-3,y:sy(yv)-3,textAnchor:'end',
        fontSize:9,fill:color});
      t.textContent=label; gp.appendChild(t);
    }
    g.appendChild(gp);
    return gp;
  }

  function addVLine(xv,color='#dc2626',sw=1.5,dash='4,3',label=''){
    const gp=svgEl('g',{'clip-path':`url(#${clipId})`});
    gp.appendChild(svgEl('line',{x1:sx(xv),x2:sx(xv),y1:0,y2:H,
      stroke:color,strokeWidth:sw,strokeDasharray:dash}));
    if(label){
      const t=svgEl('text',{x:sx(xv)+3,y:10,textAnchor:'start',fontSize:9,fill:color});
      t.textContent=label; gp.appendChild(t);
    }
    g.appendChild(gp);
    return gp;
  }

  function addArea(upper,lower,color='#0072B2',opacity=.12){
    const gp=svgEl('g',{'clip-path':`url(#${clipId})`});
    const uv=upper.filter(([x,y])=>!isNaN(x)&&!isNaN(y));
    const lv=lower.filter(([x,y])=>!isNaN(x)&&!isNaN(y));
    if(uv.length<2||lv.length<2){g.appendChild(gp);return gp;}
    const d='M'+uv.map(([x,y])=>`${sx(x)},${sy(y)}`).join('L')
      +'L'+[...lv].reverse().map(([x,y])=>`${sx(x)},${sy(y)}`).join('L')+'Z';
    gp.appendChild(svgEl('path',{d,fill:color,opacity,stroke:'none'}));
    g.appendChild(gp);
    return gp;
  }

  if(container){
    [...container.childNodes].forEach(n=>{ if(!n.classList?.contains('ch-title')) container.removeChild(n); });
    container.appendChild(svg);
  }

  return {svg,sx,sy,W,H,M,g,clipId,addPoints,addLine,addHLine,addVLine,addArea,VW,VH};
}

/* Download SVG */
function dlSVG(svg,name){
  const s=new XMLSerializer().serializeToString(svg);
  const a=document.createElement('a');
  a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  a.download=(name||'chart')+'.svg'; a.click();
}
/* Download PNG */
function dlPNG(svg,name,w=900,h=600){
  const s=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download=(name||'chart')+'.png'; a.click();
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}

function chartActions(wrap,svg,name){
  const div=document.createElement('div');
  div.className='ch-actions';

/* -- SECTION: CSV UTILITIES ---------------------------------------- */
function parseTSV(text){
  return text.trim().split('\n').map(r=>r.split('\t'));
}
function parseCSV(text){
  const rows=[];
  text.trim().split('\n').forEach(line=>{
    const cells=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQ=!inQ; }
      else if(c===','&&!inQ){ cells.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    cells.push(cur.trim());
    rows.push(cells);
  });
  return rows;
}
function toCSV(rows,headers){
  const lines=[headers.join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>{
    const v=r[h]??'';
    return String(v).includes(',')?`"${v}"`:v;
  }).join(',')));
  return lines.join('\n');
}
function downloadCSV(text,filename){
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(text);
  a.download=filename; a.click();
}
function downloadTemplate(headers,filename,sample=[]){
  const rows=[headers.join(',')];
  sample.forEach(r=>rows.push(headers.map(h=>r[h]??'').join(',')));
  downloadCSV(rows.join('\n'),filename);
}

/**
 * Build an editable data grid inside container.
 * @param {HTMLElement} container
 * @param {Array<{key,label,type}>} cols
 * @param {number} nRows
 * @param {Function} onChange  called on any cell change
 */
function buildGrid(container,cols,nRows,onChange){
  // Columns with a compute(row) function are read-only and skipped by paste, so pasted
  // spreadsheet columns line up with the columns students actually type into.
  const inputCols=cols.filter(c=>!c.compute);
  const readRow=tr=>{
    const row={};
    cols.forEach((c,ci)=>{ if(c.compute) return;
      const v=tr.cells[ci].querySelector('input').value.trim();
      row[c.key]=c.type==='number'?(v===''?null:+v):v; });
    cols.forEach(c=>{ if(c.compute) row[c.key]=c.compute(row); });
    return row;
  };
  const refreshComputed=tr=>{
    const row=readRow(tr);
    cols.forEach((c,ci)=>{ if(c.compute){ const v=row[c.key]; tr.cells[ci].querySelector('input').value=v==null||isNaN(v)?'':v; } });
  };
  const wrap=document.createElement('div');
  wrap.className='grid-wrap';
  const tbl=document.createElement('table');
  tbl.className='dgrid';
  // Header
  const thead=tbl.createTHead();
  const hr=thead.insertRow();
  cols.forEach(c=>{
    const th=document.createElement('th');
    th.textContent=c.label;
    if(c.compute){ th.className='calc'; th.title='Calculated automatically'; }
    hr.appendChild(th);
  });
  // Body
  const tbody=tbl.createTBody();
  for(let r=0;r<nRows;r++){
    const tr=tbody.insertRow();
    cols.forEach(c=>{
      const td=tr.insertCell();
      const inp=document.createElement('input');
      inp.type='text'; inp.placeholder='';
      inp.dataset.col=c.key; inp.dataset.row=r;
      if(c.compute){ inp.readOnly=true; inp.tabIndex=-1; inp.className='calc'; inp.setAttribute('aria-label',c.label+' (calculated)'); }
      else{
        inp.addEventListener('input',()=>refreshComputed(tr));
        inp.addEventListener('change',onChange);
      }
      td.appendChild(inp);
    });
  }
  wrap.appendChild(tbl);
  // Paste support
  wrap.addEventListener('paste',e=>{
    e.preventDefault();
    const tsv=e.clipboardData.getData('text/plain');
    const pasted=parseTSV(tsv);
    const ae=document.activeElement, active=ae&&ae.tagName==='INPUT'&&wrap.contains(ae)?ae:null;
    let startRow=active?+active.dataset.row:0;
    let startCol=active?inputCols.findIndex(c=>c.key===active.dataset.col):0;
    if(startCol<0) startCol=0;
    pasted.forEach((row,ri)=>{
      const tr=tbody.rows[startRow+ri]; if(!tr) return;
      row.forEach((val,ci)=>{
        const col=inputCols[startCol+ci]; if(!col) return;
        const inp=tr.cells[cols.indexOf(col)].querySelector('input');
        inp.value=val.trim();
      });
      refreshComputed(tr);
    });
    onChange();
  });
  container.appendChild(wrap);
  return {
    tbl, tbody,
    getRows(){ return Array.from(tbody.rows).map(readRow); },
    setRows(data){
      Array.from(tbody.rows).forEach((tr,ri)=>{
        cols.forEach((c,ci)=>{ if(!c.compute) tr.cells[ci].querySelector('input').value=data[ri]?.[c.key]??''; });
        refreshComputed(tr);
      });
    },
    clearRows(){
      Array.from(tbody.rows).forEach(tr=>{
        Array.from(tr.querySelectorAll('input')).forEach(i=>i.value='');
        refreshComputed(tr);
      });
    }
  };
}

/** Read valid numeric rows as a matrix [participants × trials] */
function gridToMatrix(rows,trialKeys){
  const mat=[];
  rows.forEach(r=>{
    const vals=trialKeys.map(k=>r[k]);
    if(vals.some(v=>v==null||isNaN(v)||v==='')) return;
    mat.push(vals.map(Number));
  });
  return mat;
}

// Guidance is written conditionally because each class collects its own data.
const REFLECTIONS={
  s1:[
    {q:'Based on the ICC and CV% values, would you consider this grip dynamometer reliable enough to track an individual athlete across a season? What evidence would you cite?',
     guide:`<ul>
      <li><strong>Tracking one athlete depends on CV% (or typical error) more than ICC.</strong> ICC describes how well the test ranks people within this group; CV% describes the noise around one person's score.</li>
      <li><strong>If CV% is low with a narrow CI</strong>, convert it to a smallest detectable change: about 2.77 &times; CV% (that is, 1.96 &times; &radic;2 &times; CV%). If the changes you expect over a season are larger than this, the test is fit for purpose.</li>
      <li><strong>If ICC is high but CV% is moderate</strong>, the high ICC may reflect a wide spread of strength in your group rather than a precise test. A more homogeneous squad would give a lower ICC with the same measurement error.</li>
      <li><strong>If the CIs are wide</strong> (common with small samples), base your judgement on the less favourable end of the interval.</li>
      <li>Check which ICC model you used: ICC(3,1) ignores systematic shifts between trials (such as learning), ICC(2,1) penalises them.</li></ul>`},
    {q:'What does the Bland-Altman plot between testers tell you about inter-rater reliability? Could you interchange Tester A and Tester B in a longitudinal study?',
     guide:`<ul>
      <li><strong>If the bias CI excludes zero</strong>, one tester systematically records higher values (for example through grip position, encouragement or dynamometer handle setting). Switching testers between sessions would add that bias to any change you measure.</li>
      <li><strong>If the bias is near zero but the limits are wide</strong>, testers disagree randomly. Interchanging them adds noise; compare the limits' width with the size of change you hope to detect.</li>
      <li><strong>If the bias is consistent across the range</strong>, it could be corrected, but standardising the protocol or keeping the same tester is better practice.</li>
      <li><strong>If bias and limits are both small</strong> relative to a meaningful change, the testers can reasonably be interchanged.</li>
      <li>Note that a consistency ICC can be high even when one tester reads a few kilograms higher; the Bland-Altman plot exposes what the ICC can hide.</li></ul>`},
    {q:'The individual change plot shows trial-to-trial differences. Is there evidence of a learning effect, and how would you account for this in a testing protocol?',
     guide:`<ul>
      <li><strong>If scores rise from trial 1 to trial 2 and then level off</strong>, and the trial 1 vs trial 2 bias CI excludes zero, that suggests familiarisation. Options: a familiarisation session, discarding the first trial, or using the best or mean of later trials.</li>
      <li><strong>If scores fall across trials</strong>, fatigue is more likely than learning; consider longer rest between attempts.</li>
      <li><strong>If there is no consistent direction</strong>, differences are random variation; averaging several trials reduces noise.</li>
      <li>Look at individual lines as well as the mean: a few participants improving markedly can create an apparent group learning effect.</li></ul>`},

  s2:[
    {q:'Compare jump height from flight time with jump height from the force plate. Does the pattern of bias (proportional vs. fixed) affect whether you would use flight time in practice?',
     guide:`<ul>
      <li><strong>Why they can differ:</strong> the force plate usually derives height from take-off velocity, whereas flight time assumes the body leaves and lands in the same position. Landing with flexed hips, knees or ankles, or tucking the legs, lengthens flight time and inflates height.</li>
      <li><strong>Fixed bias</strong> (a similar offset at all jump heights) can be removed by subtracting the mean bias. Change scores measured with flight time alone are unaffected by a fixed offset.</li>
      <li><strong>Proportional bias</strong> (the difference grows with jump height, shown by the proportional bias r and the sloping line) cannot be fixed by one subtraction; it needs a regression-based correction. It also scales change scores, so a real 2 cm improvement could appear larger or smaller with flight time.</li>
      <li><strong>If neither is present and the limits are narrow</strong> compared with a meaningful change in jump height, flight time may be usable on its own, provided landing technique is standardised.</li>
      <li>Whatever the pattern, flight-time and force plate heights should not be mixed within one athlete's record. Even after removing bias, the width of the limits is random disagreement that remains.</li></ul>`},
    {q:'Which force-time variables show the highest reliability (lowest CV%)? What biomechanical reasons might explain differences in reliability between variables?',
     guide:`<ul>
      <li><strong>Often most reliable:</strong> variables reflecting the whole movement or a large, well-defined peak (jump height, peak force, peak and mean power).</li>
      <li><strong>Often least reliable:</strong> rate and timing variables (braking RFD, time to take-off, RSI-mod). They depend on where phase boundaries are detected, and small changes in movement strategy (countermovement depth, speed of unweighting) alter them.</li>
      <li><strong>If your ranking differs</strong>, consider sample size (wide CIs overlap), number of trials, participant familiarity, arm swing rules, and the force threshold used to detect movement onset.</li>
      <li>Reliable is not the same as useful: a reliable variable may still change too little with training to be informative.</li></ul>`},
    {q:'A colleague wants to use peak power as an outcome in a training study. Based on the CV% and its confidence interval, what is the minimum change you would need to see before concluding a true change had occurred?',
     guide:`<ul>
      <li>For an <strong>individual</strong>, the smallest detectable change (95%) is about 2.77 &times; CV%. For example, a CV% of 3% gives roughly 8%.</li>
      <li>Using the <strong>upper limit</strong> of the CV% CI gives a conservative estimate, which is sensible with small samples.</li>
      <li><strong>If the expected training effect is smaller than this</strong>, individual changes cannot be distinguished from noise, although a group mean change may still be detectable with enough participants.</li>
      <li>These trials were collected within one session; day-to-day variation is usually larger, so the true minimum change across a training study is likely bigger than this estimate.</li></ul>`},
  ],
  s3:[
    {q:'The Bland-Altman split by concentration band shows whether agreement is constant across the range. How does this affect the clinical usefulness of the handheld device for identifying lactate threshold?',
     guide:`<ul>
      <li><strong>If agreement is similar in every band</strong>, one set of limits describes the device fairly.</li>
      <li><strong>If the bias shifts or the limits widen at higher concentrations</strong>, the full-range limits misrepresent agreement at threshold. Judge threshold use from the 2-4 mmol/L band.</li>
      <li><strong>If the handheld under-reads above 4 mmol/L</strong>, a fixed 4 mmol/L threshold read from the handheld occurs at a higher workload than the lab would give, so training zones set from it would be too hard.</li>
      <li>Translate lactate error into workload: on the flat early part of the curve a small lactate error moves the threshold by many watts, on the steep part by only a few. Methods relying on small rises (such as baseline + 0.5 mmol/L) are therefore more sensitive to device error.</li></ul>`},
    {q:'Compare the within-device CV% (duplicate samples) for the handheld vs. the lab analyser. Does the device with the wider limits of agreement also have higher within-device variability?',
     guide:`<ul>
      <li>Limits of agreement combine both devices' random error, any sample-specific differences between them, and bias. Duplicate CV% captures only one device's random error.</li>
      <li><strong>If the handheld CV% is clearly higher than the lab's</strong>, much of the width of the limits comes from handheld imprecision.</li>
      <li><strong>If both CV% values are small but the limits are wide</strong>, the disagreement is systematic or sample-related (calibration, sampling site, technique) rather than imprecision. A device can be precise and still disagree with the reference.</li>
      <li><strong>If the CV% intervals overlap substantially</strong>, you cannot conclude which device is more variable.</li>
      <li>For monitoring with one device, its own precision matters most; for swapping between devices, the limits of agreement matter.</li></ul>`},
    {q:'A coach wants to use the handheld device at lactate threshold (~2-4 mmol/L) to monitor training intensity weekly. Based on the limits of agreement, what change in lactate would you consider meaningful?',
     guide:`<ul>
      <li><strong>Use the 2-4 mmol/L band</strong>, not the full-range limits.</li>
      <li><strong>If handheld readings are compared with lab-derived zones</strong>, differences smaller than the half-width of the limits (plus any bias) cannot be separated from device disagreement.</li>
      <li><strong>If the same handheld is used every week</strong>, a constant bias cancels out. The relevant noise is the handheld's own error: estimate a typical error from the duplicates (SD of duplicate differences &divide; &radic;2) and multiply by 2.77 for the smallest detectable change.</li>
      <li><strong>Compare the two figures.</strong> If the same-device detectable change is much smaller than the limits, weekly monitoring is more sensitive than the agreement data suggest. If they are similar, using one device does not rescue small changes.</li>
      <li>Day-to-day biological variation in lactate (diet, glycogen, prior training) is not captured here and is likely larger again, so test-retest data from the athlete are needed. Because the curve is steep at 2-4 mmol/L, tracking workload or heart rate at a fixed lactate may be more practical than tracking lactate itself.</li></ul>`},

  s4:[
    {q:'The pooled scatter mixes data from multiple participants. Does colouring by participant change your interpretation of the correlation strength?',
     guide:`<ul>
      <li><strong>If each participant forms a tight line offset from the others</strong>, relationships within each person are strong, and between-person differences (fitness, how people use the RPE scale) are what weaken or strengthen the pooled r.</li>
      <li><strong>If colours intermix along one band</strong>, the relationship is similar across people and the pooled r is a reasonable summary.</li>
      <li>Repeated stages from the same person are not independent, so the pooled CI is too narrow. Repeated-measures correlation or multilevel models handle this properly.</li></ul>`},
    {q:'Compare Pearson r and Spearman rs for RPE vs lactate. If they differ, what does this suggest about the shape of the RPE-lactate relationship, and which coefficient better describes it?',
     guide:`<ul>
      <li><strong>If Spearman is clearly higher than Pearson</strong>, the relationship is consistently rising but curved: lactate rises steeply at higher intensities while RPE rises more evenly. Spearman describes this better; log-transforming lactate and recalculating Pearson is another option.</li>
      <li><strong>If Pearson is higher than Spearman</strong>, a few extreme points may be driving the linear association; check for outliers.</li>
      <li><strong>If they are similar</strong>, the relationship is close to linear.</li>
      <li>RPE is an ordinal whole-number scale with many tied values, which is an argument for Spearman regardless.</li></ul>`},

     guide:`<ul>

      <li><strong>Association is not agreement:</strong> the same RPE can correspond to different lactate values in different people; correlation does not show RPE can prescribe a target lactate.</li>
      <li><strong>Pooling and range:</strong> combining repeated stages across a wide intensity range inflates r.</li>
      <li><strong>Criterion choice:</strong> lactate is itself only one marker of intensity; validity depends on the purpose (for example, prescribing training at threshold) and on whether RPE detects change over time.</li></ul>`},

  s5:[

      <li>Zones anchored to different methods can differ by tens of watts. Using the same method consistently across retests matters more than which one is chosen; ideally a method is checked against a criterion such as maximal lactate steady state.</li></ul>`},

function buildReflections(container, questions, storeRef){
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="card-title">Reflective Questions</div>
    <div style="font-size:.8rem;color:var(--muted);margin:-.3rem 0 .8rem">Write your answer first. Guidance on possible outcomes unlocks once you have written at least a sentence; your own data may lead to any of them.</div>`;
  questions.forEach(({q,guide},i)=>{
    const d=document.createElement('div');
    d.className='refl-card';
    d.innerHTML=`<div class="refl-q">${i+1}. ${q}</div>
      <textarea rows="3" placeholder="Write your response here…" aria-label="Question ${i+1}"></textarea>
      <div class="refl-guide-row">
        <button type="button" class="btn btn-s btn-sm" aria-expanded="false">Show possible outcomes</button>
        <span class="refl-hint">Write at least a sentence to unlock</span>
      </div>
      <div class="refl-guide" hidden><div class="refl-guide-ttl">Possible outcomes: compare with your answer</div>${guide}</div>`;
    const ta=d.querySelector('textarea'), btn=d.querySelector('button'), hint=d.querySelector('.refl-hint'), box=d.querySelector('.refl-guide');
    const unlocked=()=>ta.value.trim().length>=40;
    const sync=()=>{ btn.disabled=!unlocked(); hint.hidden=unlocked(); };
    const show=open=>{ box.hidden=!open; btn.setAttribute('aria-expanded',open); btn.textContent=open?'Hide possible outcomes':'Show possible outcomes'; };
    ta.value=storeRef[i]||'';
    ta.addEventListener('input',()=>{ storeRef[i]=ta.value; saveStore(); sync(); });
    btn.addEventListener('click',()=>{ const open=box.hidden; storeRef['g'+i]=open; saveStore(); show(open); });
    sync();
    show(!!storeRef['g'+i]&&unlocked());
    card.appendChild(d);
  });
  container.appendChild(card);
}

function analyseS1(){
  const thrICC=+document.getElementById('s1-thr-icc')?.value||.9;

  // Split by tester

  const B=all.filter(r=>r.tester&&r.tester.toUpperCase()==='B');
  const all_valid=all.filter(r=>r.t1!=null&&r.t2!=null&&!isNaN(r.t1)&&!isNaN(r.t2));

  if(all_valid.length<3){
    res.innerHTML=`<div class="co co-note">Enter at least 3 rows with Trial 1 and Trial 2 values to see analyses.</div>`;
    return;

  // Build matrices

  const matA=gridToMatrix(A.filter(r=>r.t1!=null&&!isNaN(r.t1)),['t1','t2','t3'].filter(k=>A.some(r=>r[k]!=null)));
  const matB=gridToMatrix(B.filter(r=>r.t1!=null&&!isNaN(r.t1)),['t1','t2','t3'].filter(k=>B.some(r=>r[k]!=null)));

  // ICC model from select
  const iccModel=document.getElementById('s1-icc-model')?.value||'3,1';
  const iccAll=icc(matAll,iccModel);
  const cvAll=cvPercent(matAll);

  // Inter-rater: match participants
  const matchedA=[],matchedB=[];
  A.forEach(a=>{
    const b=B.find(bb=>bb.id===a.id&&bb.hand===a.hand);
    if(b&&a.t1!=null&&b.t1!=null&&!isNaN(a.t1)&&!isNaN(b.t1)){
      matchedA.push(a.t1); matchedB.push(b.t1);
    }
  });

      </div>
      <div class="sc ${cvLbl.cls}">
        <div class="sc-lbl">CV% (log method)</div>
        <div class="sc-val">${fmt1(cvAll.cv)}%</div>
        <div class="sc-ci">95% CI ${fmtCI(cvAll.ci_l,cvAll.ci_u,1)}%</div>
        <div class="sc-int">${cvLbl.txt} — ${cvAll.cv<=thrCV?'within':'exceeds'} the ${thrCV}% threshold. Use CV% to estimate the smallest worthwhile change relative to noise.</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Mean ± SD (Trial 1)</div>
        <div class="sc-val">${fmt1(mean(matAll.map(r=>r[0])))} kg</div>
        <div class="sc-ci">SD ${fmt1(sd(matAll.map(r=>r[0])))}</div>
      </div>
    </div>
    ${iccAll.warning?`<div class="co co-warn">${iccAll.warning}</div>`:''}
    <div id="s1-ch-trials" class="ch-wrap">
      <div class="ch-title">Trial 1 vs Trial 2 — scatter with identity line</div>
    </div>
    <div id="s1-ch-ba-trials" class="ch-wrap" style="margin-top:.7rem">

    ${matchedA.length<3?`<div class="co co-note">Fewer than 3 matched pairs found. Ensure both testers have measured the same participants (matching Participant ID and Hand).</div>`:`
    <div class="sg">
      <div class="sc">
        <div class="sc-lbl">Bias (A – B)</div>
        <div class="sc-val">${fmt1(ba.bias)} kg</div>
        <div class="sc-ci">95% CI ${fmtCI(ba.ci_bias[0],ba.ci_bias[1],1)}</div>
        <div class="sc-int">${Math.abs(ba.bias)<1?'Bias is small.':Math.abs(ba.bias)<3?'Moderate systematic bias.':'Substantial systematic bias — consider recalibrating technique.'}</div>

  // Draw scatter T1 vs T2
  drawS1Scatter(matAll);

function drawS1Scatter(mat){

const S2_FIXED=[

  {key:'trial',label:'Trial',             type:'number'},
  {key:'ft',   label:'Flight time (ms)',  type:'number'},

  {key:'fp',   label:'FP height (cm)',    type:'number'},
  {key:'pf',   label:'Peak force (N)',    type:'number'},
  {key:'pp',   label:'Peak power (W)',    type:'number'},
  {key:'mp',   label:'Mean power (W)',    type:'number'},
  {key:'rsi',  label:'RSI-mod',           type:'number'},
  {key:'tto',  label:'Time to take-off (s)',type:'number'},
  {key:'cd',   label:'CM depth (cm)',     type:'number'},
  {key:'brfd', label:'Braking RFD (N/s)', type:'number'},
];

const S2_INPUT=S2_FIXED.filter(c=>!c.compute);

/** Jump height from flight time: h = g*t^2/8 (t in s), returned in cm to 0.1 cm. */
function flightTimeHeight(ms){
  if(ms==null||isNaN(ms)||ms<=0) return null;
  const t=ms/1000;
  return Math.round(9.81*t*t/8*1000)/10;
}

function demoS2(){
  const ids='P01,P02,P03,P04,P05,P06,P07,P08,P09,P10,P11,P12,P13,P14,P15,P16'.split(',');
  const rows=[];
  ids.forEach((id,i)=>{
    const base_fp=30+i*1.5; // FP height base
    for(let t=1;t<=3;t++){
      const n=()=>(Math.random()-.5)*1.5;
      const fp=+(base_fp+n()).toFixed(1);
      // Flight time reads higher than the force plate's take-off velocity method, and more so for
      // higher jumps (e.g. landing with flexed hips, knees or ankles lengthens time in the air)
      const ftH=fp*1.05+1.0+n();
      const ft=Math.round(Math.sqrt(ftH/100*8/9.81)*1000);
      rows.push({
        id,trial:t,ft,fp,
        pf:+(2200+i*30+(Math.random()-.5)*60).toFixed(0),
        pp:+(3800+i*50+(Math.random()-.5)*100).toFixed(0),
        mp:+(2100+i*25+(Math.random()-.5)*80).toFixed(0),
        rsi:+(0.6+i*.02+n()*.05).toFixed(3),
        tto:+(0.82+n()*.02).toFixed(3),
        cd:+(22+i*.3+n()).toFixed(1),
        // Braking RFD is typically far noisier between trials than jump height or peak force
        brfd:+((5200+i*180)*(1+(Math.random()-.5)*.35)).toFixed(0),
      });
    }
  });
  return rows;
}

function analyseS2(){
  const thrLoA=+document.getElementById('s2-thr-loa')?.value||2;
  const thrICC=+document.getElementById('s2-thr-icc')?.value||.9;
  const thrCV =+document.getElementById('s2-thr-cv')?.value||10;
  const iccModel=document.getElementById('s2-icc-model')?.value||'3,1';
  const all=_s2Grid.getRows(); STORE.s2.rows=all; saveStore();
  const res=document.getElementById('s2-results'); if(!res) return;

  // Flight times typed in seconds (0.5) or far outside a plausible jump give misleading heights
  const oddFT=all.filter(r=>r.ft!=null&&(r.ft<150||r.ft>1200)).length;
  const ftWarn=oddFT?`<div class="co co-warn">${oddFT} flight time${oddFT===1?' is':'s are'} outside 150 to 1200 ms. Check they are entered in milliseconds (for example 512, not 0.512).</div>`:'';

  const valid=all.filter(r=>r.fp!=null&&r.fth!=null&&!isNaN(r.fp)&&!isNaN(r.fth));
  if(valid.length<4){ res.innerHTML=ftWarn+`<div class="co co-note">Enter at least 4 rows with both a flight time and an FP height.</div>`; return; }

  // Agreement: flight-time height vs force plate height
  const ftVals=valid.map(r=>+r.fth), fpVals=valid.map(r=>+r.fp);
  const ba=blandAltman(ftVals,fpVals);

  // Reliability: FP height across trials per participant
  const byPart={};
  all.filter(r=>r.id&&r.fp!=null&&!isNaN(r.fp)).forEach(r=>{
    if(!byPart[r.id]) byPart[r.id]=[];
    byPart[r.id].push(+r.fp);
  });
  const matFP=Object.values(byPart).filter(t=>t.length>=2);
  const iccFP=icc(matFP,iccModel), cvFP=cvPercent(matFP);

  // Reliability: flight-time height
  const byPartFT={};
  all.filter(r=>r.id&&r.fth!=null&&!isNaN(r.fth)).forEach(r=>{
    if(!byPartFT[r.id]) byPartFT[r.id]=[];
    byPartFT[r.id].push(+r.fth);
  });
  const matFT=Object.values(byPartFT).filter(t=>t.length>=2);
  const iccFT=icc(matFT,iccModel), cvFT=cvPercent(matFT);

  // Force-time variable reliability
  const ftVars=S2_FIXED.filter(c=>!['id','trial','ft','fth','fp'].includes(c.key));
  const ftResults=ftVars.map(col=>{
    const byP={};
    all.filter(r=>r.id&&r[col.key]!=null&&!isNaN(+r[col.key])&&+r[col.key]>0).forEach(r=>{
      if(!byP[r.id]) byP[r.id]=[];
      byP[r.id].push(+r[col.key]);
    });
    const mat=Object.values(byP).filter(t=>t.length>=2);
    if(mat.length<3) return {key:col.key,label:col.label,icc:NaN,cv:NaN,n:mat.length};
    const ir=icc(mat,iccModel), cv=cvPercent(mat);
    return {key:col.key,label:col.label,icc:ir.icc,icc_l:ir.ci_l,icc_u:ir.ci_u,
      cv:cv.cv,cv_l:cv.ci_l,cv_u:cv.ci_u,n:mat.length};
  }).filter(r=>!isNaN(r.cv)).sort((a,b)=>a.cv-b.cv);

  const loaOk=Math.abs(ba.loa_u)<=thrLoA&&Math.abs(ba.loa_l)<=thrLoA;

  res.innerHTML=ftWarn+`
  <div class="card">
    <div class="card-title">Agreement: Flight-Time vs Force Plate Jump Height</div>
    <div class="sg">
      <div class="sc ${loaOk?'good':'bad'}">
        <div class="sc-lbl">Bias (flight time minus FP)</div>
        <div class="sc-val">${fmt1(ba.bias)} cm</div>
        <div class="sc-ci">95% CI ${fmtCI(ba.ci_bias[0],ba.ci_bias[1],1)}</div>
        <div class="sc-int">${Math.abs(ba.bias)<1?'Negligible bias.':`The flight-time method reads ${ba.bias>0?'higher':'lower'} by about ${fmt1(Math.abs(ba.bias))} cm on average.`}</div>
      </div>
      <div class="sc ${loaOk?'good':'warn'}">
        <div class="sc-lbl">Limits of agreement</div>
        <div class="sc-val">${fmt1(ba.loa_l)} to ${fmt1(ba.loa_u)}</div>
        <div class="sc-ci">Acceptable ±${thrLoA} cm threshold ${loaOk?'met':'not met'}</div>
        <div class="sc-int">Disagreements of up to ${fmt1(Math.max(Math.abs(ba.loa_u),Math.abs(ba.loa_l)))} cm are plausible for any individual measurement.</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Proportional bias</div>
        <div class="sc-val">${Math.abs(ba.propBias?.r||0)>.3?'Present':'Absent'}</div>
        <div class="sc-ci">r = ${fmt2(ba.propBias?.r||0)}</div>
        <div class="sc-int">A relationship between the mean and the difference suggests bias changes with jump height.</div>
      </div>
    </div>
    <div id="s2-ch-ba" class="ch-wrap"><div class="ch-title">Bland-Altman: Flight Time minus Force Plate (cm)</div></div>
    <div id="s2-ch-scatter" class="ch-wrap" style="margin-top:.7rem"><div class="ch-title">Scatter: Flight-Time vs Force Plate Height with identity line</div></div>
  </div>

  <div class="card">
    <div class="card-title">Jump Height Reliability Across Trials</div>
    <div class="sg">
      <div class="sc ${ratingLabel(iccFP.icc).cls}">
        <div class="sc-lbl">Force plate: ICC (${iccModel})</div>
        <div class="sc-val">${fmt2(iccFP.icc)}</div>
        <div class="sc-ci">95% CI ${fmtCI(iccFP.ci_l,iccFP.ci_u)}</div>
      </div>
      <div class="sc ${cvLabel(cvFP.cv).cls}">
        <div class="sc-lbl">Force plate: CV%</div>
        <div class="sc-val">${fmt1(cvFP.cv)}%</div>
        <div class="sc-ci">95% CI ${fmtCI(cvFP.ci_l,cvFP.ci_u,1)}%</div>
      </div>
      <div class="sc ${ratingLabel(iccFT.icc).cls}">
        <div class="sc-lbl">Flight time: ICC (${iccModel})</div>
        <div class="sc-val">${fmt2(iccFT.icc)}</div>
        <div class="sc-ci">95% CI ${fmtCI(iccFT.ci_l,iccFT.ci_u)}</div>
      </div>
      <div class="sc ${cvLabel(cvFT.cv).cls}">
        <div class="sc-lbl">Flight time: CV%</div>
        <div class="sc-val">${fmt1(cvFT.cv)}%</div>
        <div class="sc-ci">95% CI ${fmtCI(cvFT.ci_l,cvFT.ci_u,1)}%</div>
      </div>
    </div>
    <div style="font-size:.8rem;color:var(--muted);margin-top:.6rem">Good reliability for both methods does not mean they agree: a method can repeat itself closely while reading consistently higher than the other.</div>
  </div>

  <div class="card">
    <div class="card-title">Force-Time Variable Reliability (Force Plate Only)</div>
    <div class="co co-warn">These variables have only one measurement device. Reliability can be estimated, but validity — whether they reflect the true construct — cannot be assessed from this dataset alone.</div>
    ${ftResults.length<2?`<div class="co co-note">Enter force-time data with at least 3 participants and 2 trials each.</div>`:`
    <div class="tbl-wrap">
    <table class="rtbl">
      <thead><tr>
        <th>Variable</th><th>n</th><th>ICC (${iccModel})</th><th>95% CI</th><th>CV%</th><th>95% CI</th><th>Rating</th>
      </tr></thead>
      <tbody>
      ${ftResults.map(r=>`<tr>
        <td>${r.label}</td>
        <td class="mono">${r.n}</td>
        <td class="mono">${fmt2(r.icc)}</td>
        <td class="mono">${fmtCI(r.icc_l,r.icc_u)}</td>
        <td class="mono">${fmt1(r.cv)}%</td>
        <td class="mono">${fmtCI(r.cv_l,r.cv_u,1)}%</td>
        <td><span style="color:var(--${cvLabel(r.cv).cls})">${cvLabel(r.cv).txt}</span></td>
      </tr>`).join('')}
      </tbody>
    </table></div>
    <div id="s2-ch-cv" class="ch-wrap" style="margin-top:.7rem">
      <div class="ch-title">CV% by variable — ranked most to least reliable</div>
    </div>`}
  </div>`;

  drawBAChart(document.getElementById('s2-ch-ba'),ba,'Mean height (cm)','cmj-ba');
  drawS2Scatter(ftVals,fpVals,ba,thrLoA);
  if(ftResults.length>=2) drawS2CVRank(ftResults,thrCV);
}

function drawS2Scatter(ftH,fp,ba,thrLoA){
  const c=document.getElementById('s2-ch-scatter'); if(!c) return;
  const all=[...ftH,...fp]; const mn=Math.min(...all)*.95,mx=Math.max(...all)*1.05;
  const ch=makeChart(c,{vw:460,vh:320,xDomain:[mn,mx],yDomain:[mn,mx],
    xLabel:'Force plate height (cm)',yLabel:'Flight-time height (cm)'});
  ch.addLine([[mn,mn],[mx,mx]],'#94a3b8',1.5,'4,3');
  ch.addLine([[mn,mn+ba.bias],[mx,mx+ba.bias]],'#0072B2',1.5,'3,2');
  ch.addLine([[mn,mn+ba.loa_u],[mx,mx+ba.loa_u]],'#D55E00',1,'4,3');
  ch.addLine([[mn,mn+ba.loa_l],[mx,mx+ba.loa_l]],'#D55E00',1,'4,3');
  ch.addPoints(zip(fp,ftH),'#009E73',4);
  chartActions(c,ch.svg,'cmj-scatter');
}

function drawS2CVRank(ftResults,thr){
  const c=document.getElementById('s2-ch-cv'); if(!c||ftResults.length<1) return;
  // Values sit in their own right-hand column so bars and CI whiskers can never cover them
  const VW=560,VH=ftResults.length*34+90;
  const M={top:34,right:118,bottom:46,left:140};
  const W=VW-M.left-M.right, H=VH-M.top-M.bottom;
  const maxCV=Math.max(...ftResults.map(r=>isNaN(r.cv_u)?r.cv:r.cv_u),thr)*1.08;
  const ticks=niceTicks(0,maxCV,6);
  const sx=scaleLin([0,ticks[ticks.length-1]>=maxCV?ticks[ticks.length-1]:maxCV],[0,W]);
  const rowH=H/ftResults.length;
  const svg=svgEl('svg',{viewBox:`0 0 ${VW} ${VH}`,role:'img','aria-label':'CV% by force-time variable'});
  svg.style.fontFamily='inherit';
  svg.appendChild(svgEl('rect',{width:VW,height:VH,fill:'white'}));
  const g=svgEl('g',{transform:`translate(${M.left},${M.top})`});
  svg.appendChild(g);

  ticks.forEach(v=>{
    g.appendChild(svgEl('line',{x1:sx(v),x2:sx(v),y1:0,y2:H,stroke:'#eef2f6'}));
    g.appendChild(svgEl('line',{x1:sx(v),x2:sx(v),y1:H,y2:H+4,stroke:'#94a3b8'}));
    const t=svgEl('text',{x:sx(v),y:H+16,textAnchor:'middle',fontSize:10,fill:'#64748b'});
    t.textContent=tickFmt(ticks.step)(v)+'%'; g.appendChild(t);
  });
  g.appendChild(svgEl('line',{x1:0,x2:W,y1:H,y2:H,stroke:'#cbd5e1'}));
  g.appendChild(svgEl('line',{x1:0,x2:0,y1:0,y2:H,stroke:'#cbd5e1'}));

  const hdr=svgEl('text',{x:W+M.right-6,y:-10,textAnchor:'end',fontSize:9.5,fontWeight:600,fill:'#475569'});
  hdr.textContent='CV% [95% CI]'; g.appendChild(hdr);

  ftResults.forEach((r,i)=>{
    const y=i*rowH+rowH/2;
    const cls=cvLabel(r.cv).cls;
    const col=cls==='good'?'#009E73':cls==='warn'?'#E69F00':'#D55E00';
    g.appendChild(svgEl('rect',{x:0,y:y-7,width:Math.max(0,sx(r.cv)),height:14,fill:col,opacity:.75,rx:2}));
    if(!isNaN(r.cv_l)&&!isNaN(r.cv_u)){
      [[sx(r.cv_l),sx(r.cv_u),y,y],[sx(r.cv_l),sx(r.cv_l),y-5,y+5],[sx(r.cv_u),sx(r.cv_u),y-5,y+5]].forEach(([x1,x2,y1,y2])=>
        g.appendChild(svgEl('line',{x1,x2,y1,y2,stroke:'#1e293b',strokeWidth:1.5})));
    }
    const lbl=svgEl('text',{x:-8,y:y+3.5,textAnchor:'end',fontSize:10,fill:'#475569'});
    lbl.textContent=r.label.replace(/ \(.*\)/,''); g.appendChild(lbl);
    const val=svgEl('text',{x:W+M.right-6,y:y+3.5,textAnchor:'end',fontSize:10,fill:'#1e293b'});
    val.textContent=`${fmt1(r.cv)}% [${fmt1(r.cv_l)}, ${fmt1(r.cv_u)}]`; g.appendChild(val);
  });

  g.appendChild(svgEl('line',{x1:sx(thr),x2:sx(thr),y1:-4,y2:H,stroke:'#D55E00',strokeWidth:1.5,strokeDasharray:'4,3'}));
  const tt=svgEl('text',{x:sx(thr),y:-10,textAnchor:'middle',fontSize:9.5,fontWeight:600,fill:'#D55E00'});
  tt.textContent='Threshold '+thr+'%'; g.appendChild(tt);

  const xl=svgEl('text',{x:W/2,y:H+36,textAnchor:'middle',fontSize:11,fill:'#475569',fontWeight:600});
  xl.textContent='CV% (bar) with 95% CI (whiskers)'; g.appendChild(xl);

  [...c.childNodes].forEach(n=>{ if(!n.classList?.contains('ch-title')) c.removeChild(n); });
  c.appendChild(svg);
  chartActions(c,svg,'cmj-cv-rank');
}

   SECTION: STATION 3 — BLOOD LACTATE
=================================================================== */
const S3_COLS=[
  {key:'id',   label:'Participant',     type:'text'},
  {key:'stage',label:'Stage',           type:'number'},
  {key:'work', label:'Workload (W)',     type:'number'},
  {key:'hr',   label:'Heart rate',      type:'number'},
  {key:'rpe',  label:'RPE (6-20)',      type:'number'},
  {key:'hh',   label:'Handheld (mmol/L)',type:'number'},
  {key:'lab',  label:'Lab (mmol/L)',    type:'number'},
  {key:'hh2',  label:'Handheld dup.',   type:'number'},
  {key:'lab2', label:'Lab dup.',        type:'number'},
];

let _s3Grid=null;

// Small seeded PRNG so the demo is identical for every student and its teaching features always appear
function mulberry32(seed){
  return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
}

function demoS3(){
  const rnd=mulberry32(20261002), u=(a,b)=>a+(b-a)*rnd(), jit=w=>(rnd()-.5)*2*w;
  // Separate stream for analyser error so the RPE and heart-rate data are unaffected by it
  const rndE=mulberry32(4041), gauss=()=>Math.sqrt(-2*Math.log(1-rndE()))*Math.cos(2*Math.PI*rndE());
  const ids='P01,P02,P03,P04,P05,P06,P07,P08'.split(',');
  const rows=[];
  ids.forEach((id,i)=>{
    // Individual physiology: lactate stays flat then turns sharply upward at a personal intensity
    const base=u(.7,1.2), amp=u(.12,.3), k=u(.5,.7), maxLac=u(6,10);
    // Heart rate rises then flattens towards an individual maximum
    const hr0=u(100,120), hrMax=u(182,198), tau=u(3.5,5.5);
    // RPE is a whole-number judgement: individual starting point, rate of rise, occasional jumps, ceiling
    const rpe0=u(7.5,9.5), rpeSlope=u(1.1,1.9);
    let lastRPE=0;
    for(let s=1;s<=7;s++){
      const work=80+s*25+(i%3)*10;
      const T=Math.min(base+amp*(Math.exp(k*(s-1))-1),maxLac);
      // Analyser error scales with concentration. Lab: ~2% random error per sample.
      // Handheld: ~4.5% random error per sample, plus a sample-specific difference from the lab
      // (~3%, e.g. capillary sampling technique) that both handheld duplicates share,
      // plus a small positive offset and under-reading above 4 mmol/L.
      const lab =T*(1+.02*gauss()), lab2=T*(1+.02*gauss());
      const sampleDiff=.03*gauss();
      const hhTrue=T+(T>4?-(T-4)*0.12:0.05);
      const hh =hhTrue*(1+sampleDiff+.045*gauss()), hh2=hhTrue*(1+sampleDiff+.045*gauss());
      const r2=v=>+Math.max(.5,v).toFixed(2);
      const hr=Math.round(hr0+(hrMax-hr0)*(1-Math.exp(-s/tau))+jit(4));
      let rpe=Math.round(rpe0+rpeSlope*(s-1)+jit(1.1));
      rpe=Math.min(20,Math.max(lastRPE,rpe)); lastRPE=rpe;
      rows.push({id,stage:s,work,hr,rpe,hh:r2(hh),lab:r2(lab),hh2:r2(hh2),lab2:r2(lab2)});
    }
  });
  return rows;
}

function loadDemoS3(){ const r=demoS3(); STORE.s3.rows=r; _s3Grid.setRows(r); analyseS3(); }
function clearS3(){ _s3Grid.clearRows(); STORE.s3.rows=[]; analyseS3(); }
function dlTemplateS3(){ downloadTemplate(S3_COLS.map(c=>c.key),'lactate-template.csv'); }
function exportCSVS3(){
  const rows=_s3Grid.getRows().filter(r=>r.hh!=null);
  downloadCSV(toCSV(rows,S3_COLS.map(c=>c.key)),'lactate-data.csv');
}
function importCSVS3(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{
    const rows=parseCSV(e.target.result);
    const mapped=rows.slice(1).map(r=>{const o={}; S3_COLS.forEach((c,i)=>{o[c.key]=r[i]??'';}); return o;});
    STORE.s3.rows=mapped; _s3Grid.setRows(mapped); analyseS3();
  };
  rd.readAsText(f);
}

function analyseS3(){
  const all=_s3Grid.getRows(); STORE.s3.rows=all; saveStore();
  const res=document.getElementById('s3-results'); if(!res) return;
  const valid=all.filter(r=>r.hh!=null&&r.lab!=null&&!isNaN(+r.hh)&&!isNaN(+r.lab)&&+r.hh>0&&+r.lab>0);
  if(valid.length<4){ res.innerHTML=`<div class="co co-note">Enter at least 4 rows with both Handheld and Lab values.</div>`; return; }

  const hh=valid.map(r=>+r.hh), lab=valid.map(r=>+r.lab);
  const baAll=blandAltman(hh,lab);

  // Split by band
  const low=valid.filter(r=>+r.lab<2);
  const mid=valid.filter(r=>+r.lab>=2&&+r.lab<4);
  const high=valid.filter(r=>+r.lab>=4);
  const baLow=low.length>=4?blandAltman(low.map(r=>+r.hh),low.map(r=>+r.lab)):null;
  const baMid=mid.length>=4?blandAltman(mid.map(r=>+r.hh),mid.map(r=>+r.lab)):null;
  const baHigh=high.length>=4?blandAltman(high.map(r=>+r.hh),high.map(r=>+r.lab)):null;

  // Duplicate reliability
  const hhDups=valid.filter(r=>r.hh2!=null&&!isNaN(+r.hh2)&&+r.hh2>0);
  const labDups=valid.filter(r=>r.lab2!=null&&!isNaN(+r.lab2)&&+r.lab2>0);
  const matHH=hhDups.map(r=>[+r.hh,+r.hh2]);
  const matLab=labDups.map(r=>[+r.lab,+r.lab2]);
  const cvHH=matHH.length>=3?cvPercent(matHH):null;
  const cvLab=matLab.length>=3?cvPercent(matLab):null;

  // Pearson + Spearman
  const pr=pearsonR(hh,lab), sr=spearmanR(hh,lab);

  res.innerHTML=`
  <div class="card">
    <div class="card-title">Handheld vs Laboratory Analyser — Full Range</div>
    <div class="sg">
      <div class="sc">
        <div class="sc-lbl">Bias (HH – Lab)</div>
        <div class="sc-val">${fmt2(baAll.bias)} mmol/L</div>
        <div class="sc-ci">95% CI ${fmtCI(baAll.ci_bias[0],baAll.ci_bias[1])}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Limits of agreement</div>
        <div class="sc-val">${fmt2(baAll.loa_l)} to ${fmt2(baAll.loa_u)}</div>
        <div class="sc-ci">n = ${baAll.n}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Pearson r</div>
        <div class="sc-val">${fmt2(pr.r)}</div>
        <div class="sc-ci">95% CI ${fmtCI(pr.ci_l,pr.ci_u)}</div>
        <div class="sc-int">A high correlation does not imply good agreement — two measures can correlate strongly yet differ systematically.</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Spearman rs</div>
        <div class="sc-val">${fmt2(sr.rs)}</div>
        <div class="sc-ci">95% CI ${fmtCI(sr.ci_l,sr.ci_u)}</div>
      </div>
    </div>
    <div class="ch2">
      <div id="s3-ch-scatter" class="ch-wrap"><div class="ch-title">Scatter with identity line</div></div>
      <div id="s3-ch-ba-all" class="ch-wrap"><div class="ch-title">Bland-Altman — full range</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Bland-Altman by Concentration Band</div>
    <div class="co co-note">Splitting by concentration tests whether agreement is homogeneous across the physiological range. Differences in bias between bands indicate concentration-dependent error.</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.75rem">
      <div>
        <div style="font-weight:600;font-size:.83rem;margin-bottom:.4rem;color:var(--muted)">&lt;2 mmol/L (n=${low.length})</div>
        ${baLow?`<div class="sc-ci">Bias ${fmt2(baLow.bias)}  LoA ${fmt2(baLow.loa_l)} to ${fmt2(baLow.loa_u)}</div>`:'<div class="sc-ci" style="color:var(--muted)">Insufficient data (&lt;4 pairs)</div>'}
        <div id="s3-ch-ba-low" class="ch-wrap" style="margin-top:.4rem"><div class="ch-title">Band &lt;2 mmol/L</div></div>
      </div>
      <div>
        <div style="font-weight:600;font-size:.83rem;margin-bottom:.4rem;color:var(--muted)">2 to 4 mmol/L (n=${mid.length})</div>

function renderS4(){

function drawS4Scatter(cId,x,y,ids,xLabel,yLabel,coloured){

  if(coloured){
    uniq.forEach((id,i)=>{
      const pts=x.map((v,j)=>[v,y[j]]).filter((_,j)=>ids[j]===id);

    });

    ch.addPoints(zip(x,y),'#0072B2',4,'circle',.65);

    ch.addLine(xs.map(xi=>[xi,lr.slope*xi+lr.intercept]),'#E69F00',1.5,'3,2');
  }
  chartActions(c,ch.svg,cId);
}

function s5HrValid(curve){
  const h=curve.hr||[];
  return h.length===curve.work.length&&h.every((v,i)=>v>0&&(i===0||v>h[i-1]));
}
function s5Interp(x,X,Y){
  const n=X.length;
  let i=0;
  if(x<=X[0]) i=0; else if(x>=X[n-1]) i=n-2; else while(i<n-2&&x>X[i+1]) i++;
  return Y[i]+(x-X[i])*(Y[i+1]-Y[i])/(X[i+1]-X[i]);
}
function s5CurrentCurve(){ return _s5State.curves[_s5State.selectedCurve]; }
function s5CurrentRater(){ return document.getElementById('s5-rater-name')?.value.trim()||'Rater 1'; }
function s5SavedPick(rater,curveId){ return STORE.s5.picks[rater]?.[curveId]||null; }

}
