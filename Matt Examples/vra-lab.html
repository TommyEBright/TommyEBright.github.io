function s5GetFit(curve,xs){
  const lac=curve.lac;
  if(!xs||xs.length<3) return null;
  if(_s5State.fitType==='linear') return {predict:x=>s5Interp(x,xs,lac)};
  return polyFit(xs,lac,_s5State.fitType==='poly3'?3:2);
}

function s5FirstCrossing(fit,target,xMin,xMax){
  const N=400; let prev=fit.predict(xMin);
  for(let i=1;i<=N;i++){
    const x=xMin+(xMax-xMin)*i/N, v=fit.predict(x);
    if((prev-target)*(v-target)<=0&&prev!==v){
      const x0=x-(xMax-xMin)/N;
      return x0+(target-prev)/(v-prev)*(x-x0);
    }
    prev=v;
  }
  return null;
}

/** Algorithmic threshold estimates in display-axis units. */
function s5AlgoEstimates(curve,xs,fit){
  const ys=curve.lac, xMn=xs[0], xMx=xs[xs.length-1], deg=_s5State.fitType==='poly2'?2:3;
  const bl=Math.min(...ys.slice(0,2));
  const at=v=>v<=Math.max(...ys)?s5FirstCrossing(fit,v,xMn,xMx):null;
  const out={
    fixed2:at(2), fixed4:at(4), bp05:at(bl+.5), bp10:at(bl+1),
    dmax:dmax(xs,ys,deg)?.x??null,
    moddmax:modDmax(xs,ys,bl,deg)?.x??null,
    logexp:logExpModDmax(xs,ys)?.x??null,
  };
  return out;
}

function s5Draw(){
  const svg=document.getElementById('lt-svg'); if(!svg) return;
  const curve=s5CurrentCurve(); if(!curve) return;
  const hrOk=s5HrValid(curve);
  const axisSel=document.getElementById('s5-xaxis');
  if(_s5State.xAxis==='hr'&&!hrOk){ _s5State.xAxis='work'; if(axisSel) axisSel.value='work'; }
  if(axisSel) axisSel.querySelector('option[value="hr"]').disabled=!hrOk;
  const useHR=_s5State.xAxis==='hr';
  const xs=useHR?curve.hr:curve.work, ys=curve.lac;
  const toDisp=w=>useHR?s5Interp(w,curve.work,curve.hr):w;
  const fromDisp=d=>useHR?s5Interp(d,curve.hr,curve.work):d;
  const fit=s5GetFit(curve,xs);

  const VW=640,VH=400, M={top:62,right:24,bottom:52,left:58};
  const W=VW-M.left-M.right, H=VH-M.top-M.bottom;
  const xMn=xs[0], xMx=xs[xs.length-1];
  const xPad=(xMx-xMn)*.03;
  const yMx=Math.ceil(Math.max(...ys)*1.1);
  const sx=scaleLin([xMn-xPad,xMx+xPad],[0,W]);
  const sy=scaleLin([0,yMx],[H,0]);
  _s5State.ctx={sx,sy,W,H,M,fit,toDisp,fromDisp,xMn,xMx};

  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(svgEl('rect',{width:VW,height:VH,fill:'#fff'}));
  const clipId='lt-clip';
  const defs=svgEl('defs'), cp=svgEl('clipPath',{id:clipId});
  cp.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H})); defs.appendChild(cp); svg.appendChild(defs);
  const g=svgEl('g',{transform:`translate(${M.left},${M.top})`});
  svg.appendChild(g);

  // Grid, frame and ticks
  const yStep=yMx<=8?1:2;
  for(let v=0;v<=yMx;v+=yStep){
    g.appendChild(svgEl('line',{x1:0,x2:W,y1:sy(v),y2:sy(v),stroke:'#eef2f6',strokeWidth:1}));
    g.appendChild(svgEl('line',{x1:0,x2:-4,y1:sy(v),y2:sy(v),stroke:'#94a3b8'}));
    const t=svgEl('text',{x:-8,y:sy(v)+3.5,textAnchor:'end',fontSize:10,fill:'#64748b'});
    t.textContent=v; g.appendChild(t);
  }
  xs.forEach(v=>{
    g.appendChild(svgEl('line',{x1:sx(v),x2:sx(v),y1:H,y2:H+4,stroke:'#94a3b8'}));
    const t=svgEl('text',{x:sx(v),y:H+16,textAnchor:'middle',fontSize:10,fill:'#64748b'});
    t.textContent=Math.round(v); g.appendChild(t);
  });
  g.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H,fill:'none',stroke:'#cbd5e1',strokeWidth:1}));
  const xl=svgEl('text',{x:W/2,y:H+40,textAnchor:'middle',fontSize:11,fill:'#475569',fontWeight:600});
  xl.textContent=useHR?'Heart rate (bpm)':'Workload (W)'; g.appendChild(xl);
  const yl=svgEl('text',{x:0,y:0,textAnchor:'middle',fontSize:11,fill:'#475569',fontWeight:600,
    transform:`translate(${-M.left+15},${H/2}) rotate(-90)`});
  yl.textContent='Lactate (mmol/L)'; g.appendChild(yl);

  const plot=svgEl('g',{'clip-path':`url(#${clipId})`});
  g.appendChild(plot);

  // Algorithmic overlays; in rating mode they stay hidden until this rater has saved this curve
  const saved=s5SavedPick(s5CurrentRater(),curve.id);
  const showAlgo=!_s5State.ratingMode||!!saved;
  const est=fit?s5AlgoEstimates(curve,xs,fit):{};
  const labels=[];
  if(showAlgo){
    S5_ALGOS.filter(a=>_s5State.algoToggle[a.k]&&est[a.k]!=null).forEach(a=>{
      const x=sx(est[a.k]);
      plot.appendChild(svgEl('line',{x1:x,x2:x,y1:0,y2:H,stroke:a.col,strokeWidth:1.5,strokeDasharray:a.dash}));
      labels.push({x,text:a.lbl,col:a.col});
    });
  }
  // Stack labels into rows above the plot so neighbouring methods never overlap
  const rowEnds=[];
  labels.sort((p,q)=>p.x-q.x).forEach(l=>{
    const w=l.text.length*5.4+8;
    const left=Math.max(0,Math.min(W-w,l.x-w/2));
    let row=rowEnds.findIndex(end=>left>end+4);
    if(row<0){ row=rowEnds.length; rowEnds.push(0); }
    rowEnds[row]=left+w;
    const y=-8-row*13;
    g.appendChild(svgEl('line',{x1:l.x,x2:l.x,y1:y+3,y2:0,stroke:l.col,strokeWidth:1,opacity:.5}));
    const t=svgEl('text',{x:left+w/2,y,textAnchor:'middle',fontSize:9.5,fontWeight:600,fill:l.col});
    t.textContent=l.text; g.appendChild(t);
  });

  // Fitted curve and stage data
  if(fit){
    const pts=linspace(xMn,xMx,200).map(x=>`${sx(x)},${sy(fit.predict(x))}`);
    plot.appendChild(svgEl('path',{d:'M'+pts.join('L'),stroke:'#334155',strokeWidth:2,fill:'none'}));
  }
  zip(xs,ys).forEach(([x,y])=>{
    plot.appendChild(svgEl('circle',{cx:sx(x),cy:sy(y),r:4.5,fill:'#334155',stroke:'#fff',strokeWidth:1.5}));
  });

  // Rater markers (stored in watts, drawn on the current axis)
  [['LT1','#0072B2'],['LT2','#CC3311']].forEach(([name,col])=>{
    const w=_s5State.markers[name]; if(w==null) return;
    const dx=toDisp(w), cx=sx(dx), cy=fit?sy(fit.predict(dx)):H/2;
    plot.appendChild(svgEl('line',{x1:cx,x2:cx,y1:cy,y2:H,stroke:col,strokeWidth:1.5,opacity:.6}));
    const grp=svgEl('g',{cursor:'ew-resize','aria-label':`${name} marker`});
    grp.dataset.marker=name;
    grp.appendChild(svgEl('circle',{cx,cy,r:12,fill:col,stroke:'#fff',strokeWidth:2}));
    const t=svgEl('text',{x:cx,y:cy+3.5,textAnchor:'middle',fontSize:9,fontWeight:700,fill:'#fff',style:'pointer-events:none'});
    t.textContent=name; grp.appendChild(t);
    g.appendChild(grp);
  });

  s5UpdateReadout(curve);
  s5RenderAlgoTable(curve,est,showAlgo);
}

function s5RenderAlgoTable(curve,est,showAlgo){
  const el=document.getElementById('s5-algo-table'); if(!el) return;
  if(!showAlgo){
    el.innerHTML=`<div class="co co-note" style="margin-top:.7rem">Rating mode: method estimates are hidden until you save your picks for ${curve.id}.</div>`;
    return;
  }
  const {fromDisp}=_s5State.ctx, hrOk=s5HrValid(curve);
  const rows=S5_ALGOS.map(a=>{
    const d=est[a.k];
    if(d==null) return `<tr><td>${a.lbl}</td><td class="mono" colspan="3">Not reached on this curve</td></tr>`;
    const w=fromDisp(d), lac=s5Interp(w,curve.work,curve.lac);
    return `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${a.col};margin-right:.4rem"></span>${a.lbl}</td>
      <td class="mono">${Math.round(w)}</td><td class="mono">${hrOk?Math.round(s5Interp(w,curve.work,curve.hr)):'—'}</td>
      <td class="mono">${fmt2(lac)}</td></tr>`;
  });
  el.innerHTML=`<details style="margin-top:.8rem"><summary style="cursor:pointer;font-size:.85rem;font-weight:600">Method estimates for ${curve.id}</summary>
    <div class="tbl-wrap" style="margin-top:.5rem"><table class="rtbl">
    <thead><tr><th>Method</th><th>Workload (W)</th><th>HR (bpm)</th><th>Lactate (mmol/L, observed)</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>
    <div style="font-size:.78rem;color:var(--muted);margin-top:.4rem">Log-Exp-ModDmax: exponential curve fit, with the Dmax line drawn from the log-log lactate threshold (Beaver et al. 1985) to the final stage (Jamnick et al. 2018). Fixed and baseline-plus methods use the selected curve fit.</div>
    </details>`;
}

function s5AttachDrag(){
  const svg=document.getElementById('lt-svg'); if(!svg) return;
  const toPlot=e=>{
    const c=_s5State.ctx; if(!c) return null;
    const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse());
    return {x:q.x-c.M.left,y:q.y-c.M.top};
  };
  const toWatts=px=>{
    const c=_s5State.ctx;
    const d=Math.max(c.xMn,Math.min(c.xMx,c.sx.invert(px)));
    return c.fromDisp(d);
  };
  const redraw=()=>{
    if(_s5State.rafPending) return;
    _s5State.rafPending=true;
    requestAnimationFrame(()=>{ _s5State.rafPending=false; s5Draw(); });
  };
  svg.addEventListener('pointerdown',e=>{
    const c=_s5State.ctx; if(!c||!c.fit) return;
    const pt=toPlot(e); if(!pt) return;
    const hit=e.target.closest('[data-marker]');
    let name=hit?.dataset.marker;
    if(!name){
      if(pt.x<0||pt.x>c.W||pt.y<-10||pt.y>c.H+10) return;
      const w=toWatts(pt.x), mk=_s5State.markers;
      if(mk.LT1==null) name='LT1';
      else if(mk.LT2==null) name='LT2';
      else name=Math.abs(w-mk.LT1)<=Math.abs(w-mk.LT2)?'LT1':'LT2';
      mk[name]=w;
    }
    _s5State.dragging=name;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
    redraw();
  });
  svg.addEventListener('pointermove',e=>{
    if(!_s5State.dragging) return;
    const pt=toPlot(e); if(!pt) return;
    _s5State.markers[_s5State.dragging]=toWatts(pt.x);
    redraw();
  });
  const end=()=>{ if(_s5State.dragging){ _s5State.dragging=null; redraw(); } };
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',end);
}

function s5UpdateReadout(curve){
  const rd=document.getElementById('s5-readout'); if(!rd) return;
  const hrOk=s5HrValid(curve), peakHR=hrOk?Math.max(...curve.hr):0;
  const parts=[['LT1','#0072B2'],['LT2','#CC3311']].map(([name,col])=>{
    const w=_s5State.markers[name];
    if(w==null) return `<div class="lt-readout" style="border-left:3px solid ${col}"><strong style="color:${col}">${name}</strong><br>Click the chart to place</div>`;
    const lac=s5Interp(w,curve.work,curve.lac);
    const hr=hrOk?Math.round(s5Interp(w,curve.work,curve.hr)):null;
    return `<div class="lt-readout" style="border-left:3px solid ${col}">
      <strong style="color:${col}">${name}</strong><br>
      Work: ${Math.round(w)} W<br>
      Lactate: ${fmt2(lac)} mmol/L<br>
      ${hr!=null?`HR: ${hr} bpm (${Math.round(hr/peakHR*100)}% peak HR)`:'HR: not recorded'}
    </div>`;
  });
  const order=_s5State.markers.LT1!=null&&_s5State.markers.LT2!=null&&_s5State.markers.LT1>_s5State.markers.LT2
    ?`<div class="co co-warn" style="margin:0">LT1 is to the right of LT2. They will be swapped when you save.</div>`:'';
  rd.innerHTML=`${parts.join('')}
    <div style="font-size:.78rem;color:var(--muted);align-self:center;max-width:300px">
      Click the chart to place LT1, then LT2. Drag a marker to adjust, or click near one to move it.
    </div>${order}`;
}

function s5SavePicks(){
  const curve=s5CurrentCurve(); if(!curve) return;
  const name=s5CurrentRater();
  let {LT1,LT2}=_s5State.markers;
  if(LT1==null||LT2==null){ s5UpdateProgress('Place both LT1 and LT2 before saving.'); return; }
  if(LT1>LT2) [LT1,LT2]=[LT2,LT1];
  if(!STORE.s5.picks[name]) STORE.s5.picks[name]={};
  STORE.s5.picks[name][curve.id]={rater:name,curveId:curve.id,LT1:Math.round(LT1*10)/10,LT2:Math.round(LT2*10)/10};
  saveStore();
  s5UpdatePicksSummary();
  s5AnalysePooled();
  // Move on to the next curve this rater has not yet rated
  const n=_s5State.curves.length;
  for(let k=1;k<=n;k++){
    const i=(_s5State.selectedCurve+k)%n;
    if(!s5SavedPick(name,_s5State.curves[i].id)){
      s5SelectCurve(i);
      s5UpdateProgress(`Saved ${curve.id}. Now on ${_s5State.curves[i].id}.`);
      return;
    }
  }
  s5SelectCurve(_s5State.selectedCurve);
  s5UpdateProgress(`All ${n} curves rated by ${name}. Press "Start next rater" to hand over.`);
}

function s5NextRater(){
  const existing=Object.keys(STORE.s5.picks);
  let k=existing.length+1;
  while(existing.includes('Rater '+k)) k++;
  const inp=document.getElementById('s5-rater-name');
  inp.value='Rater '+k;
  s5SelectCurve(0);
  s5UpdateProgress(`Now rating: ${inp.value}. Type your own name in the box if you like.`);
  inp.focus(); inp.select();
}

function s5ClearAllPicks(){
  if(!confirm('Delete every saved pick from every rater?')) return;
  STORE.s5.picks={}; saveStore();
  document.getElementById('s5-rater-name').value='Rater 1';
  s5SelectCurve(0); s5UpdatePicksSummary(); s5AnalysePooled();
}

function s5UpdateProgress(msg=''){
  const el=document.getElementById('s5-progress'); if(!el) return;
  const rater=s5CurrentRater();
  const done=_s5State.curves.filter(c=>s5SavedPick(rater,c.id)).length;
  const chips=_s5State.curves.map((c,i)=>{
    const isDone=!!s5SavedPick(rater,c.id), cur=i===_s5State.selectedCurve;
    return `<button class="tog${isDone?' act':''}" style="${cur?'outline:2px solid var(--primary);outline-offset:1px':''}"
      onclick="s5SelectCurve(${i})" title="${isDone?'Rated, click to review or change':'Not yet rated'}">${isDone?'&#10003; ':''}${escapeHTML(c.id)}</button>`;
  }).join('');
  el.innerHTML=`<div style="margin-bottom:.4rem"><strong>${escapeHTML(rater)}</strong>: ${done} of ${_s5State.curves.length} curves rated
    ${msg?`<span style="color:var(--primary);margin-left:.5rem">${escapeHTML(msg)}</span>`:''}</div>
    <div class="tog-grp">${chips}</div>`;
}

function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function s5UpdatePicksSummary(){
  const el=document.getElementById('s5-picks-summary'); if(!el) return;
  const raters=Object.keys(STORE.s5.picks);
  if(!raters.length){ el.innerHTML=''; return; }
  const rows=raters.flatMap(r=>Object.values(STORE.s5.picks[r]).map(p=>
    `<tr><td>${escapeHTML(p.rater)}</td><td>${escapeHTML(p.curveId)}</td>
     <td class="mono">${p.LT1!=null?Math.round(p.LT1):'—'}</td>
     <td class="mono">${p.LT2!=null?Math.round(p.LT2):'—'}</td></tr>`
  ));
  el.innerHTML=`<details style="margin-top:.8rem"><summary style="cursor:pointer;font-size:.85rem;font-weight:600">All saved picks (${rows.length})</summary>
  <div class="tbl-wrap" style="margin-top:.5rem">
  <table class="rtbl"><thead><tr><th>Rater</th><th>Curve</th><th>LT1 (W)</th><th>LT2 (W)</th></tr></thead>
  <tbody>${rows.join('')}</tbody></table></div></details>`;
}

function s5ExportPicks(){
  const rows=[];
  Object.values(STORE.s5.picks).forEach(rater=>{
    Object.values(rater).forEach(p=>{
      rows.push(`${p.rater},${p.curveId},${p.LT1??''},${p.LT2??''}`);
    });
  });
  downloadCSV('rater,curve,LT1_W,LT2_W\n'+rows.join('\n'),'lt-rater-picks.csv');
}

function s5ImportPicks(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{
    const rows=parseCSV(e.target.result).slice(1);
    rows.forEach(r=>{
      const [rater,curveId,lt1,lt2]=r;
      if(!rater||!curveId) return;
      if(!STORE.s5.picks[rater]) STORE.s5.picks[rater]={};
      STORE.s5.picks[rater][curveId]={rater,curveId,LT1:lt1?+lt1:null,LT2:lt2?+lt2:null};
    });
    saveStore(); s5UpdatePicksSummary(); s5AnalysePooled(); s5SelectCurve(_s5State.selectedCurve);
  };
  rd.readAsText(f);
  inp.value='';
}

/** Pooled inter-rater analysis across every curve that at least two raters have saved. */
function s5AnalysePooled(){
  const el=document.getElementById('s5-pooled-results'); if(!el) return;
  el.innerHTML='';
  const picks=STORE.s5.picks;
  const raters=Object.keys(picks).filter(r=>Object.keys(picks[r]).length);
  if(raters.length<2){
    el.innerHTML=`<div class="co co-note">Saved picks from ${raters.length} rater${raters.length===1?'':'s'} so far. Save picks from at least 2 raters to see the pooled analysis.</div>`;
    return;
  }
  const known=_s5State.curves.map(c=>c.id);
  const allIds=[...new Set([...known,...raters.flatMap(r=>Object.keys(picks[r]))])];
  const shared=allIds.filter(cid=>raters.filter(r=>picks[r][cid]).length>=2);
  const complete=shared.filter(cid=>raters.every(r=>picks[r][cid]?.LT1!=null&&picks[r][cid]?.LT2!=null));

  const cards=['LT1','LT2'].map(th=>{
    if(complete.length<3) return '';
    const mat=complete.map(cid=>raters.map(r=>picks[r][cid][th]));
    const ir=icc(mat,'2,1'), cv=cvPercent(mat);
    const meanSD=mean(complete.map(cid=>sd(raters.map(r=>picks[r][cid][th]))));
    return `<div class="sc ${ratingLabel(ir.icc).cls}">
      <div class="sc-lbl">${th}: ICC(2,1)</div>
      <div class="sc-val">${fmt2(ir.icc)}</div>
      <div class="sc-ci">95% CI ${fmtCI(ir.ci_l,ir.ci_u)}</div>
      <div class="sc-int">CV% ${fmt1(cv.cv)} ${fmtCI(cv.ci_l,cv.ci_u,1)}%. Mean between-rater SD ${Math.round(meanSD)} W.</div>
    </div>`;
  }).join('');

  const stageRows=shared.map(cid=>{
    const c=_s5State.curves.find(x=>x.id===cid);
    const inc=c?mean(c.work.slice(1).map((w,i)=>w-c.work[i])):NaN;
    const cell=th=>{
      const v=raters.map(r=>picks[r][cid]?.[th]).filter(x=>x!=null);
      if(v.length<2) return '<td class="mono">—</td><td class="mono">—</td>';
      const s=sd(v), st=s/inc;
      const cls=isNaN(st)?'':st<.5?'good':st<1?'warn':'bad';
      return `<td class="mono">${Math.round(s)}</td><td class="mono" style="color:var(--${cls||'muted'})">${isNaN(st)?'—':fmt2(st)}</td>`;
    };
    return `<tr><td>${escapeHTML(cid)}</td><td class="mono">${isNaN(inc)?'—':Math.round(inc)}</td>${cell('LT1')}${cell('LT2')}</tr>`;
  }).join('');

  const baA=_s5State.baA&&raters.includes(_s5State.baA)?_s5State.baA:raters[0];
  const baB=_s5State.baB&&raters.includes(_s5State.baB)&&_s5State.baB!==baA?_s5State.baB:raters.find(r=>r!==baA);
  const baT=_s5State.baT||'LT2';
  const opt=(sel)=>raters.map(r=>`<option${r===sel?' selected':''}>${escapeHTML(r)}</option>`).join('');

  el.innerHTML=`
    <div style="font-size:.85rem;margin-bottom:.7rem">${raters.length} raters; ${shared.length} curves rated by two or more; ${complete.length} rated by every rater.</div>
    ${complete.length<3?`<div class="co co-note">ICC and CV% need at least 3 curves rated by every rater (currently ${complete.length}).</div>`:`<div class="sg">${cards}</div>`}
    <div class="tbl-wrap" style="margin:.8rem 0"><table class="rtbl">
      <thead><tr><th>Curve</th><th>Stage increment (W)</th><th>LT1 SD (W)</th><th>LT1 SD (stages)</th><th>LT2 SD (W)</th><th>LT2 SD (stages)</th></tr></thead>
      <tbody>${stageRows}</tbody></table></div>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:.8rem">Between-rater SD expressed in stage increments: below 0.5 is unlikely to change a training prescription; above 1 is practically meaningful.</div>
    <div id="s5-dots"></div>
    <div class="f-row" style="align-items:flex-end;margin-top:.6rem">
      <div class="f-grp"><label>Bland-Altman: rater A</label><select onchange="_s5State.baA=this.value;s5AnalysePooled()">${opt(baA)}</select></div>
      <div class="f-grp"><label>minus rater B</label><select onchange="_s5State.baB=this.value;s5AnalysePooled()">${opt(baB)}</select></div>
      <div class="f-grp"><label>Threshold</label><select onchange="_s5State.baT=this.value;s5AnalysePooled()">
        <option${baT==='LT1'?' selected':''}>LT1</option><option${baT==='LT2'?' selected':''}>LT2</option></select></div>
    </div>
    <div id="s5-ba-raters" class="ch-wrap"><div class="ch-title">Bland-Altman: ${escapeHTML(baA)} minus ${escapeHTML(baB)} (${baT}, W)</div></div>`;

  const dots=document.getElementById('s5-dots');
  ['LT1','LT2'].forEach(th=>drawS5DotPlot(th,shared,raters,dots));
  const common=allIds.filter(cid=>picks[baA]?.[cid]?.[baT]!=null&&picks[baB]?.[cid]?.[baT]!=null);
  const ba=blandAltman(common.map(c=>picks[baA][c][baT]),common.map(c=>picks[baB][c][baT]));
  drawBAChart(document.getElementById('s5-ba-raters'),ba,`Mean ${baT} (W)`,'s5-ba-raters');
}

function drawS5DotPlot(thresh,curveIds,raters,container){
  const COLS=['#0072B2','#E69F00','#009E73','#D55E00','#56B4E9','#CC79A7'];
  const allVals=raters.flatMap(r=>curveIds.map(c=>STORE.s5.picks[r]?.[c]?.[thresh])).filter(v=>v!=null);
  if(allVals.length<2) return;
  const mn=Math.min(...allVals)*.95, mx=Math.max(...allVals)*1.05;
  const VW=500,VH=30+curveIds.length*36+50;
  const M={top:15,right:20,bottom:40,left:70};
  const W=VW-M.left-M.right,H=VH-M.top-M.bottom;
  const sx=scaleLin([mn,mx],[0,W]);
  const rowH=H/curveIds.length;
  const svg=svgEl('svg',{viewBox:`0 0 ${VW} ${VH}`});
  svg.style.fontFamily='inherit';
  svg.appendChild(svgEl('rect',{width:VW,height:VH,fill:'white'}));
  const g=svgEl('g',{transform:`translate(${M.left},${M.top})`});

  curveIds.forEach((cid,ri)=>{
    const y=ri*rowH+rowH/2;
    const vals=raters.map(r=>STORE.s5.picks[r]?.[cid]?.[thresh]).filter(v=>v!=null);
    if(vals.length<2) return;
    const m=mean(vals),s=sd(vals);
    // Mean bar
    g.appendChild(svgEl('line',{x1:sx(m-s),x2:sx(m+s),y1:y,y2:y,stroke:'#94a3b8',strokeWidth:2}));
    g.appendChild(svgEl('line',{x1:sx(m),x2:sx(m),y1:y-8,y2:y+8,stroke:'#1e293b',strokeWidth:2}));
    raters.forEach((r,ri2)=>{
      const v=STORE.s5.picks[r]?.[cid]?.[thresh];
      if(v==null) return;
      g.appendChild(svgEl('circle',{cx:sx(v),cy:y,r:5,fill:COLS[ri2%COLS.length],opacity:.85,stroke:'#fff',strokeWidth:1}));
    });
    const lbl=svgEl('text',{x:-6,y:y+4,textAnchor:'end',fontSize:10,fill:'#475569'});
    lbl.textContent=cid; g.appendChild(lbl);
  });

  g.appendChild(svgEl('line',{x1:0,x2:W,y1:H,y2:H,stroke:'#cbd5e1'}));
  linspace(mn,mx,6).forEach(v=>{
    g.appendChild(svgEl('line',{x1:sx(v),x2:sx(v),y1:H,y2:H+4,stroke:'#94a3b8'}));
    const t=svgEl('text',{x:sx(v),y:H+14,textAnchor:'middle',fontSize:9,fill:'#64748b'});
    t.textContent=Math.round(v); g.appendChild(t);
  });
  const xl=svgEl('text',{x:W/2,y:H+28,textAnchor:'middle',fontSize:10,fill:'#475569',fontWeight:600});
  xl.textContent='Workload (W)'; g.appendChild(xl);
  svg.appendChild(g);

  const wrap=document.createElement('div');
  wrap.className='ch-wrap';
  const ttl=document.createElement('div');
  ttl.className='ch-title'; ttl.textContent=`${thresh} picks by curve (dots = raters, line = mean ± SD)`;
  wrap.appendChild(ttl); wrap.appendChild(svg);
  const legend=document.createElement('div');
  legend.style.cssText='display:flex;flex-wrap:wrap;gap:.8rem;padding:.4rem .9rem .7rem;font-size:.78rem;color:var(--muted)';
  legend.innerHTML=raters.map((r,i)=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${COLS[i%COLS.length]};margin-right:.3rem"></span>${escapeHTML(r)}</span>`).join('');
  wrap.appendChild(legend);
  container.appendChild(wrap);
  chartActions(wrap,svg,`lt-dot-${thresh}`);
}

/** Generic Bland-Altman chart */
function drawBAChart(container,ba,xLabel,name){
  if(!container) return;
  if(!ba||ba.n<4){
    const note=document.createElement('div');
    note.style.cssText='padding:1rem;color:var(--muted);font-size:.83rem';
    note.textContent='Insufficient data for Bland-Altman plot (need ≥4 pairs).';
    container.appendChild(note);
    return;
  }
  const {means,diffs,bias,loa_u,loa_l,ci_bias,ci_loa_u,ci_loa_l}=ba;
  const pad=.08;
  const xAll=means, yAll=diffs;
  const xMn=Math.min(...xAll),xMx=Math.max(...xAll);
  const xRange=xMx-xMn||1;
  const xDom=[xMn-xRange*pad, xMx+xRange*pad];
  const yAll2=[...diffs,loa_u,loa_l];
  const yRange=Math.max(...yAll2)-Math.min(...yAll2)||1;
  const yDom=[Math.min(...yAll2)-yRange*.2, Math.max(...yAll2)+yRange*.2];

  const ch=makeChart(container,{vw:500,vh:340,xDomain:xDom,yDomain:yDom,
    xLabel:xLabel||'Mean',yLabel:'Difference',ariaLabel:'Bland-Altman plot'});

  // CI shading
  ch.addArea(
    [[xDom[0],ci_loa_u[1]],[xDom[1],ci_loa_u[1]]],
    [[xDom[0],ci_loa_u[0]],[xDom[1],ci_loa_u[0]]],
    '#D55E00',.15);
  ch.addArea(
    [[xDom[0],ci_loa_l[1]],[xDom[1],ci_loa_l[1]]],
    [[xDom[0],ci_loa_l[0]],[xDom[1],ci_loa_l[0]]],
    '#D55E00',.15);
  ch.addArea(
    [[xDom[0],ci_bias[1]],[xDom[1],ci_bias[1]]],
    [[xDom[0],ci_bias[0]],[xDom[1],ci_bias[0]]],
    '#0072B2',.15);

  ch.addHLine(0,'#94a3b8',1,'4,3');
  ch.addHLine(loa_u,'#D55E00',1.5,'5,3','ULoA');
  ch.addHLine(loa_l,'#D55E00',1.5,'5,3','LLoA');
  ch.addHLine(bias,'#0072B2',2,'','Bias');

  // Proportional bias line
  if(ba.propBias&&Math.abs(ba.propBias.r)>.2){
    const {slope,intercept}=ba.propBias;
    ch.addLine([[xDom[0],slope*xDom[0]+intercept],[xDom[1],slope*xDom[1]+intercept]],'#CC79A7',1,'3,2');
  }

  ch.addPoints(zip(means,diffs),'#0072B2',4);

  // Stats annotation
  const g2=svgEl('g');
  const ann=svgEl('text',{x:ch.M.left+6,y:16,fontSize:9,fill:'#475569'});
  ann.textContent=`Bias ${fmt2(bias)} [${fmt1(ba.ci_bias[0])}, ${fmt1(ba.ci_bias[1])}]  LoA ${fmt1(loa_l)} to ${fmt1(loa_u)}`;
  ch.svg.appendChild(ann);

  chartActions(container,ch.svg,name||'ba-chart');
}
