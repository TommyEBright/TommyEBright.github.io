<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Philosophy Explorer</title>
<meta name="description" content="An interactive tool for Level 5 sport and exercise science students exploring ontology, epistemology, paradigms and research design.">
<style>
:root{
  /* Change this one value to re-theme the tool */
  --accent:#0b6e69;
  --accent-ink:#ffffff;
  --accent-soft:#e2f1ef;
  --bg:#f5f6f7;
  --surface:#ffffff;
  --surface-2:#eceff2;
  --text:#1b1f24;
  --muted:#4f5862;
  --border:#cdd3d9;
  --focus:#1747c9;
  --ok:#1b6a32; --ok-bg:#e5f3e9;
  --bad:#a1262b; --bad-bg:#fbe8e9;
  --warn:#8a5d00; --warn-bg:#fff5d9;
  --mark:#ffe27a; --mark-ink:#1b1f24;
  /* Paradigm colours, always shown with a text label */
  --p-positivism:#1f5fbf;
  --p-postpositivism:#0d7385;
  --p-criticalrealism:#7044b0;
  --p-interpretivism:#b04f16;
  --p-pragmatism:#2b7a30;
  --p-postmodernism:#ad2868;
  --tension:#8a5d00;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --accent:#5fd0c7; --accent-ink:#062523; --accent-soft:#15302e;
    --bg:#111316; --surface:#1a1d21; --surface-2:#252a30; --text:#e8ebee; --muted:#a9b1ba; --border:#3a414a;
    --focus:#ffd166;
    --ok:#82d89c; --ok-bg:#14301d; --bad:#ff9ea2; --bad-bg:#3a1a1c; --warn:#f0c55a; --warn-bg:#33290e;
    --mark:#5a4700; --mark-ink:#fff6d6;
    --p-positivism:#78a8ff; --p-postpositivism:#4fc4d6; --p-criticalrealism:#b896ff;
    --p-interpretivism:#ff9d62; --p-pragmatism:#80d084; --p-postmodernism:#ff7fbb; --tension:#f0c55a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:break-word}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:8px;z-index:30;background:var(--surface);color:var(--text);padding:10px 14px;border-radius:8px}
.skip:focus{left:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{max-width:840px;margin:0 auto;padding:16px 16px 8px}
header.top h1{font-size:1.3rem;margin:0;line-height:1.25}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.tabbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:840px;margin:0 auto;padding:6px 12px;scrollbar-width:thin}
.tab{flex:0 0 auto;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .tick{margin-left:4px}
main{max-width:840px;margin:0 auto;padding:16px}
section[role="tabpanel"]>h2{font-size:1.3rem;margin:4px 0 8px}
h3{font-size:1.08rem;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:10px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.secondary{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.row.split{justify-content:space-between}
.prog{margin:0 0 14px}
.prog .bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.prog .bar span{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog p{margin:4px 0 0;font-size:.88rem;color:var(--muted)}
.pbadge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--pc);border-radius:999px;padding:1px 10px;font-weight:600;font-size:.88rem;line-height:1.6;background:var(--surface)}
.pbadge .dot,.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:0 0 auto;display:inline-block}
.p-positivism{--pc:var(--p-positivism)} .p-postpositivism{--pc:var(--p-postpositivism)} .p-criticalrealism{--pc:var(--p-criticalrealism)}
.p-interpretivism{--pc:var(--p-interpretivism)} .p-pragmatism{--pc:var(--p-pragmatism)} .p-postmodernism{--pc:var(--p-postmodernism)} .p-tension{--pc:var(--tension)}
a.gl{color:inherit;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
a.gl:hover{color:var(--accent)}
/* Intro */
.layers{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.layers li{background:var(--surface-2);border-radius:10px;padding:10px 12px;border-left:5px solid var(--accent)}
.layers li strong{display:block}
.layers li:nth-child(2){margin-left:12px}.layers li:nth-child(3){margin-left:24px}.layers li:nth-child(4){margin-left:36px}
details.gloss{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:0 0 8px}
details.gloss summary{min-height:48px;padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:10px}
details.gloss summary::-webkit-details-marker{display:none}
details.gloss summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted)}
details.gloss[open] summary::after{content:"\2212"}
details.gloss .gbody{padding:0 14px 14px}
details.gloss .gbody p{margin:0 0 8px}
.example{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:0}
.example b{display:block;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
/* Likert */
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font-size:1.12rem;font-weight:600;margin:0 0 12px}
.qnum{display:block;font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 14px;border:2px solid var(--border);border-radius:10px;margin:0 0 8px;cursor:pointer;background:var(--surface)}
.opt input{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opt input:checked + .ol{font-weight:700}
.opt .ol small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.opt .ol .ex{display:block;font-size:.92rem;margin-top:4px;font-weight:400}
.likert-grid{display:grid;gap:0}
@media (min-width:700px){.likert-grid{grid-template-columns:repeat(5,1fr);gap:8px}.likert-grid .opt{flex-direction:column;align-items:center;text-align:center;font-size:.92rem}}
/* Results map */
.map-wrap{max-width:420px;margin:0 auto 12px}
.map-wrap svg{width:100%;height:auto;display:block}
.scores{display:grid;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.note{border-left:5px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin:12px 0}
/* Detective */
.extract{font-size:1.02rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:0 0 14px;border-left:5px solid var(--border)}
mark{background:var(--mark);color:var(--mark-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;border-radius:3px;padding:0 2px}
.choices{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:560px){.choices{grid-template-columns:1fr 1fr}}
.choice{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border:2px solid var(--border);border-left:8px solid var(--pc);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-weight:600;text-align:left;cursor:pointer}
.choice:disabled{cursor:default}
.choice .state{margin-left:auto;font-size:.82rem;font-weight:700}
.choice.is-correct{background:var(--ok-bg);border-color:var(--ok);border-left-color:var(--pc)}
.choice.is-wrong{background:var(--bad-bg);border-color:var(--bad);border-left-color:var(--pc)}
.fb{border-radius:10px;padding:12px 14px;margin:14px 0 0;border-left:6px solid var(--border);background:var(--surface-2)}
.fb.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.fb .verdict{font-weight:700;font-size:1.05rem;margin:0 0 6px}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p{margin:0 0 8px} .fb p:last-child{margin-bottom:0}
.cues{margin:4px 0 10px;padding-left:20px}
/* Mismatch */
.els{display:grid;gap:8px}
.el{display:block;width:100%;text-align:left;padding:10px 14px;min-height:48px;border:2px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.el .k{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.el .v{display:block;margin-top:2px}
.el:disabled{cursor:default}
.el.consistent{background:var(--surface-2);opacity:.85}
.el.consistent .k .tag{color:var(--ok)}
.el.mismatch{border-color:var(--bad);background:var(--bad-bg)}
.el.mismatch .k .tag{color:var(--bad)}
/* Onion */
.onion-layout{display:grid;gap:16px}
@media (max-width:759px){#onion-main{order:-1}}
@media (min-width:760px){.onion-layout{grid-template-columns:260px 1fr;align-items:start}.onion-side{position:sticky;top:72px}}
.onion-svg{max-width:220px;margin:0 auto}
.onion-svg svg{width:100%;height:auto;display:block}
.steps{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px}
.steps button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;min-height:44px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer}
.steps button[aria-current="step"]{border:2px solid var(--accent);background:var(--accent-soft);font-weight:700}
.steps .st{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.steps .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:.8rem;font-weight:700;flex:0 0 auto}
label.fl{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:.95rem}
.prompts{margin:14px 0 0}
.prompts ul{margin:6px 0 0;padding-left:20px}
.summary-text{min-height:300px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.5}
.status{min-height:1.5em;font-weight:600;color:var(--ok);margin:8px 0 0}
.confirm{margin-top:10px;padding:12px;border:2px solid var(--bad);border-radius:10px;background:var(--bad-bg)}
.confirm p{margin:0 0 8px;font-weight:600}
footer{max-width:840px;margin:0 auto;padding:8px 16px 32px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <h1>Research Philosophy Explorer</h1>
  <p>Ontology, epistemology, paradigms and design in sport and exercise science</p>
</header>
<nav class="tabbar" aria-label="Sections">
  <div class="tabs" role="tablist" id="tablist"></div>
</nav>
<main id="main">
  <section role="tabpanel" id="panel-intro" aria-labelledby="tab-intro" tabindex="-1"></section>
  <section role="tabpanel" id="panel-stance" aria-labelledby="tab-stance" tabindex="-1" hidden></section>
  <section role="tabpanel" id="panel-detective" aria-labelledby="tab-detective" tabindex="-1" hidden></section>
  <section role="tabpanel" id="panel-mismatch" aria-labelledby="tab-mismatch" tabindex="-1" hidden></section>
  <section role="tabpanel" id="panel-onion" aria-labelledby="tab-onion" tabindex="-1" hidden></section>
</main>
<footer>Everything runs in your browser. Nothing you enter is sent anywhere.</footer>

<script>
/* =====================================================================
   TEACHING CONTENT
   Edit the text in this object to change what students see.
   Link to a glossary term anywhere with [[termId|visible text]],
   for example [[ontology|ontological]]. Term ids are the keys in
   CONTENT.glossary below.
   ===================================================================== */
const CONTENT = {

  /* ---------- Paradigm labels (used for colour-coded badges) ---------- */
  paradigms: {
    positivism:      { label: "Positivism" },
    postpositivism:  { label: "Post-positivism" },
    criticalrealism: { label: "Critical realism" },
    interpretivism:  { label: "Interpretivism" },
    pragmatism:      { label: "Pragmatism" },
    postmodernism:   { label: "Postmodernism" }
  },

  /* ---------- Section 1. Introduction and glossary ---------- */
  intro: {
    welcome: "Every study rests on assumptions about what is real and how we can know it. This tool helps you recognise those assumptions in published research and make them explicit in your own dissertation.",
    howTo: [
      "Work through the tabs in order during the lecture, or jump to any section.",
      "Underlined terms link back to the glossary in this section.",
      "Your progress is saved on this device where your browser allows it."
    ],
    layers: [
      { term: "ontology",     q: "What exists?",             text: "Your view of the nature of reality." },
      { term: "epistemology", q: "How can we know it?",      text: "What counts as valid knowledge and evidence." },
      { term: "methodology",  q: "How should we study it?",  text: "The overall strategy that follows from the layers above." },
      { term: "methods",      q: "What tools will we use?",  text: "The specific techniques for collecting and analysing data." }
    ],
    layersNote: "Each layer should follow from the one above. [[axiology|Axiology]], the role of values, runs alongside all four. A coherent set of answers is often described as a [[paradigm|paradigm]]."
  },

  glossary: {
    ontology: {
      term: "Ontology",
      def: "The study of what exists and the nature of reality. Your ontological position is your view of whether reality exists independently of us (realism) or is constructed through human experience (relativism).",
      example: "Is team cohesion a real property of a squad waiting to be measured, or something players build and understand in different ways?"
    },
    epistemology: {
      term: "Epistemology",
      def: "The study of knowledge. It asks how we can know about reality and what counts as acceptable evidence.",
      example: "Can we know how anxious a gymnast feels from heart rate data alone, or do we need to ask them and interpret what they say?"
    },
    axiology: {
      term: "Axiology",
      def: "The role of values and ethics in research. It asks whether research can be value free and how the researcher's values shape the questions asked and the interpretation of findings.",
      example: "A researcher who is also a club physiotherapist may bring values about player welfare that influence what they choose to study and how they read the results."
    },
    methodology: {
      term: "Methodology",
      def: "The overall strategy or logic linking your philosophical position to the methods you use. It explains why you are collecting data in a particular way.",
      example: "A randomised controlled trial, an ethnography and a case study are all methodologies."
    },
    methods: {
      term: "Methods",
      def: "The specific tools and techniques used to collect and analyse data.",
      example: "Force plate testing, GPS tracking, questionnaires, semi-structured interviews and thematic analysis are all methods."
    },
    paradigm: {
      term: "Paradigm",
      def: "A shared set of beliefs about ontology, epistemology and methodology that guides how a research community works. Paradigms help explain why researchers studying the same topic can design very different studies.",
      example: "Two researchers studying burnout in coaches might run a large survey or a series of life history interviews, depending on their paradigm."
    },
    positivism: {
      term: "Positivism",
      def: "Assumes a single, objective reality that can be measured. Knowledge comes from observation, measurement and hypothesis testing, with the researcher kept separate from what is studied. It aims for generalisable, causal explanations.",
      example: "Testing whether beetroot juice improves 5 km time trial performance using a randomised controlled trial."
    },
    postpositivism: {
      term: "Post-positivism",
      def: "Shares the realist view of positivism but accepts that all measurement is imperfect and that knowledge is probabilistic and open to revision. It emphasises error, uncertainty and falsification.",
      example: "Reporting the effect of a strength programme with confidence intervals and acknowledging the measurement error of the 1RM test."
    },
    criticalrealism: {
      term: "Critical realism",
      def: "Holds that reality exists independently of us but that our knowledge of it is always partial and shaped by context. It looks for underlying mechanisms that produce observable events, often combining types of data and using retroductive reasoning.",
      example: "Investigating which hidden organisational mechanisms lead some academies to have higher injury rates than others."
    },
    interpretivism: {
      term: "Interpretivism (including constructivism)",
      def: "Views reality as socially constructed and multiple. Knowledge comes from understanding the meanings people give to their experiences, and the researcher is part of that process. Constructivism is a closely related position that stresses how knowledge is actively co-constructed between researcher and participant.",
      example: "Interviewing retired footballers to understand how they make sense of life after professional sport."
    },
    pragmatism: {
      term: "Pragmatism",
      def: "Focuses on the research question and on what works in practice. Rather than committing to one view of reality, pragmatists choose the methods most useful for solving a problem, often mixing quantitative and qualitative data.",
      example: "Combining attendance data with interviews to help a leisure centre improve uptake of an exercise referral scheme."
    },
    postmodernism: {
      term: "Postmodernism",
      def: "Questions the idea of a single truth or grand explanation. It focuses on language, power and whose voices are heard or silenced, often by deconstructing dominant narratives.",
      example: "Analysing media coverage of female athletes to show how language reinforces particular ideas about gender and sport."
    },
    reasoning: {
      term: "Deduction, induction and abduction",
      def: "Three approaches to developing theory. Deduction starts with a theory, derives a hypothesis and tests it with data. Induction starts with data and builds theory from the patterns found. Abduction moves back and forth between data and theory to find the best explanation for a surprising observation. Retroduction, used in critical realism, is a related form of reasoning that asks what mechanisms must exist for an observation to occur.",
      example: "Deduction tests whether self-determination theory predicts gym adherence. Induction builds a new model of adherence from interviews. Abduction starts from a puzzling drop in adherence and works out which explanation fits best."
    }
  },

  /* ---------- Section 2. Where do you stand ---------- */
  stance: {
    intro: "Rate each statement. There are no right answers. Your responses place you on a map of [[ontology|ontology]] and [[epistemology|epistemology]].",
    scale: ["Strongly disagree", "Disagree", "Neither agree nor disagree", "Agree", "Strongly agree"],
    /* axis: "ontology" or "epistemology". dir: "R" (agreement scores towards realist or objectivist) or "reversed" */
    statements: [
      { text: "Fatigue exists in an athlete whether or not anyone measures it", axis: "ontology", dir: "R" },
      { text: "What counts as “talent” depends on who is doing the judging", axis: "ontology", dir: "reversed" },
      { text: "There is one correct explanation for why a team lost, even if we never find it", axis: "ontology", dir: "R" },
      { text: "Ideas like “mental toughness” are created by people rather than discovered", axis: "ontology", dir: "reversed" },
      { text: "Physiological adaptations to training follow principles that apply to everyone", axis: "ontology", dir: "R" },
      { text: "Two players can experience the same training session as genuinely different sessions", axis: "ontology", dir: "reversed" },
      { text: "The best research removes the researcher's influence entirely", axis: "epistemology", dir: "R" },
      { text: "To understand an athlete, you need to see the world from their perspective", axis: "epistemology", dir: "reversed" },
      { text: "If you can't measure something, you can't study it properly", axis: "epistemology", dir: "R" },
      { text: "A coach's intuition is a valid form of knowledge", axis: "epistemology", dir: "reversed" },
      { text: "Good research should produce the same results whoever carries it out", axis: "epistemology", dir: "R" },
      { text: "Research findings are always shaped by the researcher's values", axis: "epistemology", dir: "reversed" }
    ],
    centreZone: 0.25, /* both scores within plus or minus this value counts as the central pragmatism zone */
    disclaimer: "This is a conversation starter, not a diagnosis. Many researchers adopt the position that best suits a particular question rather than holding one fixed identity, so your answers might shift from project to project.",
    positions: {
      positivist: {
        name: "Positivism and post-positivism", paradigms: ["positivism", "postpositivism"],
        explain: "Your answers lean towards a realist ontology and an objectivist epistemology. You tend to see reality as existing independently of us and believe it can be studied through careful, detached measurement. If you also accept that measurement is always imperfect, you are closer to [[postpositivism|post-positivism]].",
        designs: "Experimental and quasi-experimental designs, randomised controlled trials, cross-sectional surveys and longitudinal cohort studies, usually analysed statistically.",
        example: "A randomised crossover trial testing whether a carbohydrate mouth rinse improves cycling time trial performance.",
        challenge: "If two athletes describe the same session in completely different ways, is one of them simply wrong, or might there be something your measurements cannot capture?"
      },
      criticalrealist: {
        name: "Critical realism", paradigms: ["criticalrealism"],
        explain: "Your answers lean towards a realist ontology but a more interpretive epistemology. You seem to accept that a real world exists while recognising that our knowledge of it is partial, fallible and shaped by context. This is close to [[criticalrealism|critical realism]].",
        designs: "Mixed methods, case studies and theory-driven evaluations that look for underlying mechanisms, often using retroductive reasoning.",
        example: "Combining injury surveillance data with interviews with medical staff to explain why a return-to-play protocol works in one club but not another.",
        challenge: "If mechanisms cannot be observed directly, how would you convince a sceptical positivist that they exist at all?"
      },
      interpretivist: {
        name: "Interpretivism and constructivism", paradigms: ["interpretivism"],
        explain: "Your answers lean towards a relativist ontology and a subjectivist epistemology. You tend to see reality as multiple and constructed, and believe understanding comes from exploring the meanings people give to their experiences. This is close to [[interpretivism|interpretivism]].",
        designs: "Qualitative designs such as phenomenology, ethnography, narrative inquiry and grounded theory, using interviews, observation and reflexive analysis.",
        example: "Life story interviews with Paralympic athletes exploring how they construct their athletic identity.",
        challenge: "If a governing body needs to know whether a new warm-up reduces hamstring injuries across a whole league, how would your position help answer that question?"
      },

  /* =================== Section 2 =================== */
  function stanceScores() {
    const o = [], e = [];

      const a = state.stance.answers[i];

    });

  }

      <rect x="${cx - z}" y="${cy - z}" width="${2 * z}" height="${2 * z}" class="p-pragmatism" fill="var(--surface)" stroke="var(--pc)" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="${cx}" y="${cy - z - 4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text)">Pragmatism</text>
      <line x1="${cx - h}" y1="${cy}" x2="${cx + h}" y2="${cy}" stroke="var(--muted)" stroke-width="1.2"/>
      <line x1="${cx}" y1="${cy - h}" x2="${cx}" y2="${cy + h}" stroke="var(--muted)" stroke-width="1.2"/>

  /* =================== Section 3 =================== */
  function highlight(text, cues) {
    const lower = text.toLowerCase(), ranges = [];
    cues.forEach(c => { const i = lower.indexOf(c.toLowerCase()); if (i >= 0) ranges.push([i, i + c.length]); });
    ranges.sort((a, b) => a[0] - b[0]);
    let out = "", pos = 0;
    ranges.forEach(([a, b]) => { if (a < pos) return; out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; pos = b; });
    return out + esc(text.slice(pos));
  }
  function renderDetective(focus) {
    const p = $("#panel-detective"), d = state.detective, X = C.detective.extracts, n = X.length;
    let body;
    if (d.done) {
      const score = X.filter((x, i) => d.answers[i] === x.answer).length;
      body = `${progress(n, n, "Extract")}
        <div class="card">
          <h3 id="det-end" tabindex="-1">You identified ${score} of ${n} paradigms correctly</h3>

      body = `${progress(d.i + 1, n, "Extract")}
        <div class="card">
          <h3 id="det-h" tabindex="-1">Extract ${d.i + 1}</h3>

          <div class="choices" role="group" aria-labelledby="det-q">${choices}</div>
          ${fb}

    }
    p.innerHTML = `<h2 tabindex="-1">Paradigm detective</h2><p class="lead">${rich(C.detective.intro)}</p>${body}`;
    if (d.done) {
      $("#det-retry").addEventListener("click", () => { state.detective = blankDet(); save("detective"); renderTabs(); renderDetective(true); });
      $("#det-on").addEventListener("click", () => { showTab("mismatch"); focusEl($("#panel-mismatch h2")); });

    if (focus) focusEl($("#det-h"));
  }

  /* =================== Section 4 =================== */
  const MKEYS = ["question", "ontology", "epistemology", "methodology", "methods", "claims"];
  function renderMismatch(focus) {
    const p = $("#panel-mismatch"), m = state.mismatch, SC = C.mismatch.scenarios, n = SC.length, L = C.mismatch.labels;
    let body;
    if (m.done) {
      const first = SC.filter((s, i) => m.tried[i][0] === s.mismatch).length;
      const second = SC.filter((s, i) => m.tried[i][0] !== s.mismatch && m.tried[i][1] === s.mismatch).length;

            ? `<p><strong>The mismatch was the ${esc(L[s.mismatch].toLowerCase())}.</strong> ${rich(s.why)}</p><p><strong>A coherent alternative</strong> ${rich(s.alternative)}</p>`

        </div>`;

      $("#mis-retry").addEventListener("click", () => { state.mismatch = blankMis(); save("mismatch"); renderTabs(); renderMismatch(true); });
      $("#mis-on").addEventListener("click", () => { showTab("onion"); focusEl($("#panel-onion h2")); });
      if (focus) focusEl($("#mis-end"));
      return;
    }
    $$(".el", p).forEach(b => b.addEventListener("click", () => { m.tried[m.i].push(b.dataset.k); save("mismatch"); renderMismatch(); focusEl($("#mis-fb")); }));

    if (nx) nx.addEventListener("click", () => { if (m.i < n - 1) m.i++; else m.done = true; save("mismatch"); renderTabs(); renderMismatch(true); });

  /* =================== Section 5 =================== */
  const OS = C.onion.steps, NSTEPS = OS.length;
  function stepDone(i) {
    const o = state.onion, k = OS[i].key;
    if (k === "topic") return !!(o.title.trim() || o.question.trim());
    if (k === "strategy") return o.strategy.length > 0;
    if (k === "techniques") return !!o.techniques.trim();
    return !!o[k];
  }
  function optLabel(stepKey, id) { const s = OS.find(x => x.key === stepKey); const op = s && s.options && s.options.find(x => x.id === id); return op ? op.label : ""; }
  function choiceText(i) {
    const o = state.onion, s = OS[i];
    if (s.key === "topic") return o.title || o.question;
    if (s.key === "strategy") return o.strategy.map(id => optLabel("strategy", id)).join(", ");
    if (s.key === "techniques") return o.techniques;
    return optLabel(s.key, o[s.key]);
  }
  function onionPrompts() {
    const o = state.onion;
    return C.onion.checks.filter(r => Object.keys(r.if).every(k => {
      const v = r.if[k];
      if (k === "techniques") return new RegExp(v, "i").test(o.techniques || "");
      const vals = Array.isArray(v) ? v : [v], cur = o[k];
      if (Array.isArray(cur)) return cur.some(x => vals.includes(x));
      return vals.includes(cur);
    })).map(r => r.text);
  }
  function onionSVG() {
    const o = state.onion, cx = 160, cy = 160, ringSteps = OS.map((s, i) => i).filter(i => OS[i].ring);
    let out = "";
    ringSteps.forEach((si, k) => {
      const r = 150 - k * 22, cur = o.step === si, dn = stepDone(si);
      const fill = cur ? "var(--accent)" : dn ? "var(--accent-soft)" : "var(--surface-2)";
      out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${cur ? "var(--text)" : "var(--border)"}" stroke-width="${cur ? 3 : 1.5}"/>`;
    });
    ringSteps.forEach((si, k) => {
      const r = 150 - k * 22, cur = o.step === si, dn = stepDone(si), last = k === ringSteps.length - 1;
      const ty = last ? cy + 5 : cy - r + 15;
      out += `<text x="${cx}" y="${ty}" text-anchor="middle" font-size="12" font-weight="700" fill="${cur ? "var(--accent-ink)" : "var(--text)"}">${si + 1}${dn && !cur ? " ✓" : ""}</text>`;
    });
    const desc = OS.map((s, i) => `Step ${i + 1} ${s.short}, ${o.step === i ? "current" : stepDone(i) ? "done" : "to do"}`).join(". ");
    return `<svg viewBox="0 0 320 320" role="img" aria-label="Research onion progress. ${esc(desc)}"><title>Research onion progress</title>${out}</svg>`;
  }
  function renderOnionSide() {
    const o = state.onion;
    $("#onion-svg").innerHTML = onionSVG();
    const items = OS.map((s, i) => {
      const st = o.step === i ? "Current" : stepDone(i) ? "Done" : "To do";
      return `<li><button type="button" data-step="${i}" ${o.step === i ? 'aria-current="step"' : ""}><span class="num" aria-hidden="true">${i + 1}</span><span><span class="sr">Step ${i + 1}, </span>${esc(s.short)}</span><span class="st">${st}</span></button></li>`;
    });
    items.push(`<li><button type="button" data-step="${NSTEPS}" ${o.step === NSTEPS ? 'aria-current="step"' : ""}><span class="num" aria-hidden="true">✓</span><span>Summary</span><span class="st">${o.step === NSTEPS ? "Current" : ""}</span></button></li>`);
    $("#onion-steps").innerHTML = items.join("");
    $$("#onion-steps button").forEach(b => b.addEventListener("click", () => goStep(+b.dataset.step)));
  }
  function goStep(i) { state.onion.step = i; save("onion"); renderTabs(); renderOnionMain(true); renderOnionSide(); }
  function promptsHTML() {
    const ps = onionPrompts();
    return ps.length ? `<div class="note prompts"><strong>Things to consider</strong><ul>${ps.map(t => `<li>${esc(t)}</li>`).join("")}</ul><p style="margin:6px 0 0;font-size:.9rem">These are prompts, not errors. Some combinations can be justified.</p></div>` : "";
  }
  function refreshPrompts() { const el = $("#onion-prompts"); if (el) el.innerHTML = promptsHTML(); renderOnionSide(); }

  function summaryText() {
    const o = state.onion, lines = ["MY RESEARCH ONION", ""];
    lines.push("Working title: " + (o.title.trim() || "(not yet written)"));
    lines.push("Research question: " + (o.question.trim() || "(not yet written)"));
    OS.forEach((s, i) => {
      if (s.key === "topic") return;
      lines.push("");
      lines.push(`${i + 1}. ${s.title}`);
      lines.push("   Choice: " + (choiceText(i) || "(not yet chosen)").replace(/\n/g, "\n   "));
      const j = (o.just[s.key] || "").trim();
      lines.push("   Justification: " + (j || "(not yet written)").replace(/\n/g, "\n   "));
    });
    const ps = onionPrompts();
    if (ps.length) { lines.push("", "Points to consider"); ps.forEach(t => lines.push("- " + t)); }
    lines.push("", C.onion.reminder);
    return lines.join("\n");
  }

  function renderOnionMain(focus) {
    const o = state.onion, main = $("#onion-main");
    if (o.step >= NSTEPS) {
      main.innerHTML = `<div class="card">
        <h3 id="on-h" tabindex="-1">Summary</h3>
        <p>Here are your choices and justifications. Use the step list to go back and edit anything.</p>
        <label class="fl" for="onion-summary-text">Your research onion summary</label>
        <textarea id="onion-summary-text" class="summary-text" readonly>${esc(summaryText())}</textarea>
        <div class="row"><button type="button" class="btn" id="on-copy">Copy to clipboard</button><button type="button" class="btn secondary" id="on-dl">Download as text file</button></div>
        <p class="status" id="on-status" role="status" aria-live="polite"></p>
        <p class="note">${rich(C.onion.reminder)}</p>
        <div class="row split"><button type="button" class="btn secondary" id="on-back">Back</button><button type="button" class="btn danger" id="on-reset">Start again</button></div>
        <div id="on-confirm"></div>
      </div>`;
      $("#on-copy").addEventListener("click", copySummary);
      $("#on-dl").addEventListener("click", downloadSummary);
      $("#on-back").addEventListener("click", () => goStep(NSTEPS - 1));
      $("#on-reset").addEventListener("click", showResetConfirm);
      if (focus) focusEl($("#on-h"));
      return;
    }
    const s = OS[o.step];
    let inner = "";
    if (s.key === "topic") {
      inner = `<label class="fl" for="on-title">Working title</label><input type="text" id="on-title" value="${esc(o.title)}" autocomplete="off">
        <label class="fl" for="on-question">Research question</label><textarea id="on-question">${esc(o.question)}</textarea>
        <p class="tip"><strong>Tip.</strong> ${rich(s.tip)}</p>`;
    } else if (s.type === "text") {
      inner = `<label class="fl" for="on-tech">Data collection and analysis</label><textarea id="on-tech">${esc(o.techniques)}</textarea>
        <p class="tip"><strong>Tip.</strong> ${rich(s.tip)}</p>`;
    } else {
      const multi = s.type === "multi";
      inner = `<fieldset><legend class="sr">${esc(s.title)} options</legend>${s.options.map(op => {
        const checked = multi ? o.strategy.includes(op.id) : o[s.key] === op.id;
        const badge = s.key === "philosophy" ? `<span class="dot p-${op.id}" aria-hidden="true" style="margin-right:6px"></span>` : "";
        return `<label class="opt"><input type="${multi ? "checkbox" : "radio"}" name="on-${s.key}" value="${op.id}" ${checked ? "checked" : ""}><span class="ol">${badge}${esc(op.label)}<small>${esc(op.desc)}</small><span class="ex"><em>Example.</em> ${esc(op.ex)}</span></span></label>`;
      }).join("")}</fieldset>`;
    }
    const justify = s.key !== "topic" ? `<label class="fl" for="on-just">${esc(C.onion.justifyPrompt)}</label><textarea id="on-just">${esc(o.just[s.key] || "")}</textarea>` : "";
    main.innerHTML = `<div class="card">
      ${progress(o.step + 1, NSTEPS, "Step")}
      <h3 id="on-h" tabindex="-1">Step ${o.step + 1}. ${esc(s.title)}</h3>
      <p>${rich(s.text)}</p>
      ${inner}
      ${justify}
      <div id="onion-prompts" aria-live="polite">${promptsHTML()}</div>
      <div class="row split">
        <button type="button" class="btn secondary" id="on-prev" ${o.step === 0 ? "disabled" : ""}>Back</button>
        <button type="button" class="btn" id="on-next">${o.step === NSTEPS - 1 ? "See summary" : "Next"}</button>
      </div>
    </div>`;
    const bind = (id, fn) => { const el = $("#" + id); if (el) el.addEventListener("input", () => { fn(el.value); save("onion"); refreshPrompts(); }); };
    bind("on-title", v => o.title = v);
    bind("on-question", v => o.question = v);
    bind("on-tech", v => o.techniques = v);
    bind("on-just", v => o.just[s.key] = v);
    $$(`input[name="on-${s.key}"]`, main).forEach(inp => inp.addEventListener("change", () => {
      if (s.type === "multi") o.strategy = $$(`input[name="on-${s.key}"]:checked`, main).map(x => x.value);
      else o[s.key] = inp.value;
      save("onion"); refreshPrompts();
    }));
    $("#on-prev").addEventListener("click", () => { if (o.step > 0) goStep(o.step - 1); });
    $("#on-next").addEventListener("click", () => goStep(o.step + 1));
    if (focus) focusEl($("#on-h"));
  }
  function setStatus(t) { const el = $("#on-status"); if (el) { el.textContent = ""; setTimeout(() => { el.textContent = t; }, 30); } }
  async function copySummary() {
    const ta = $("#onion-summary-text"), txt = ta.value;
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); ok = true; } } catch (e) { ok = false; }
    if (!ok) {
      ta.focus(); ta.select();
      try { ta.setSelectionRange(0, txt.length); } catch (e) { /* ignore */ }
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    }
    setStatus(ok ? "Copied to clipboard." : "Copying was blocked, so the text has been selected. Press Ctrl+C or Cmd+C, or long-press to copy it.");
  }
  function downloadSummary() {
    try {
      const blob = new Blob([summaryText()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "my-research-onion.txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setStatus("Download started. If nothing happened, use Copy to clipboard instead.");
    } catch (e) {
      setStatus("Downloading is not available here. Use Copy to clipboard instead.");
    }
  }
  function showResetConfirm() {
    const box = $("#on-confirm");
    box.innerHTML = `<div class="confirm" role="group" aria-labelledby="conf-t"><p id="conf-t">Clear all your onion choices and start again?</p><div class="row" style="margin-top:0"><button type="button" class="btn danger" id="conf-yes">Yes, clear everything</button><button type="button" class="btn secondary" id="conf-no">Cancel</button></div></div>`;
    $("#conf-yes").addEventListener("click", () => { state.onion = blankOnion(); store.del("onion"); renderTabs(); renderOnion(true); });
    $("#conf-no").addEventListener("click", () => { box.innerHTML = ""; focusEl($("#on-reset")); });
    focusEl($("#conf-no"));
  }
  function renderOnion(focus) {
    $("#panel-onion").innerHTML = `<h2 tabindex="-1">My research onion</h2><p class="lead">${rich(C.onion.intro)}</p>
      <div class="onion-layout">
        <div class="onion-side card"><div class="onion-svg" id="onion-svg"></div><nav aria-label="Onion steps"><ol class="steps" id="onion-steps"></ol></nav></div>
        <div id="onion-main"></div>
      </div>`;
    renderOnionSide();
    renderOnionMain(focus);
  }

  /* ---- Boot ---- */
  renderIntro(); renderStance(); renderDetective(); renderMismatch(); renderOnion();
  showTab(currentTab);
})();
</script>
</body>
</html>
